<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<link rel="manifest" href="manifest.webmanifest?v=8">
<link rel="icon" href="yasri-delivery-logo.svg?v=8" type="image/svg+xml">
<link rel="apple-touch-icon" href="yasri-delivery-logo.svg?v=8">
<link rel="stylesheet" href="style.css?v=8">
<title>دخول الدلفري</title>
</head>
<body>
<main class="login-shell">
  <section class="login-card">
    <img src="yasri-delivery-logo.svg?v=8" alt="مطعم الياسري - التوصيل دلفري" style="width:120px;height:120px;border-radius:28px;object-fit:cover;display:block;margin:0 auto 14px;">
    <h1>دخول الدلفري</h1>
    <p class="muted">أدخل الكود الذي أعطاك إياه صاحب المطعم.</p>
    <input id="driverCode" type="password" inputmode="text" placeholder="كود الدلفري">
    <button id="driverLoginBtn" class="btn btn-primary full">دخول</button>
    <div id="driverLoginMsg" class="login-msg"></div>
    <div id="driverDebug" class="muted small">جاري الاتصال بالنظام...</div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import { firebaseConfig } from "./firebase-config.js";

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getDatabase(app);
const $=id=>document.getElementById(id);
let uid=null;

function withTimeout(promise,ms=10000){
  return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error("timeout")),ms))]);
}

async function ensureAnonymous(){
  if(auth.currentUser){uid=auth.currentUser.uid;return auth.currentUser}
  const cred=await withTimeout(signInAnonymously(auth));
  uid=cred.user.uid;return cred.user;
}

async function checkExisting(){
  try{
    if(!uid)return false;
    const ss=await get(ref(db,"sessions/"+uid));
    if(!ss.exists())return false;
    const code=ss.val().code;
    const cs=await get(ref(db,"accessCodes/"+code));
    const v=cs.val();
    if(v&&v.enabled===true&&v.role==="driver"){
      location.replace("driver-app.html");
      return true;
    }
  }catch(e){}
  return false;
}

async function login(){
  const code=$("driverCode").value.trim();
  if(!code)return $("driverLoginMsg").textContent="اكتب كود الدلفري";
  $("driverLoginBtn").disabled=true;
  $("driverLoginMsg").textContent="جاري التحقق...";
  try{
    await ensureAnonymous();
    const codeSnap=await withTimeout(get(ref(db,"accessCodes/"+code)));
    const v=codeSnap.val();
    if(!(v&&v.enabled===true&&v.role==="driver")){
      $("driverLoginMsg").textContent="الكود غير صحيح أو متوقف";
      return;
    }
    await withTimeout(set(ref(db,"sessions/"+uid),{code,createdAt:Date.now()}));
    location.replace("driver-app.html");
  }catch(e){
    console.error(e);
    $("driverLoginMsg").textContent=String(e?.message||"").includes("timeout")?"انتهت مهلة الاتصال، حاول مرة أخرى":"تعذر تسجيل الدخول";
  }finally{
    $("driverLoginBtn").disabled=false;
  }
}
$("driverLoginBtn").onclick=login;
$("driverCode").addEventListener("keydown",e=>{if(e.key==="Enter")login()});

onAuthStateChanged(auth,async user=>{
  if(user){
    uid=user.uid;
    $("driverDebug").textContent="متصل بالنظام";
    await checkExisting();
  }else{
    try{await ensureAnonymous();$("driverDebug").textContent="متصل بالنظام"}catch(e){$("driverDebug").textContent="تعذر الاتصال بالنظام"}
  }
});
</script>
</body>
</html>
