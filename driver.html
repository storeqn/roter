<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>تطبيق الدلفري</title>
</head>
<body>
<main class="container narrow">
<section class="card">
  <div class="driver-head">
    <div><div class="badge">تطبيق الدلفري</div><h1>الدوام والتتبع 🛵</h1></div>
    <div id="liveDot" class="live-dot off"></div>
  </div>
  <p class="muted">أدخل بياناتك والطلب الحالي، ثم ابدأ الدوام والتتبع.</p>

  <label>اسم الدلفري</label>
  <input id="driverName" placeholder="مثال: أحمد">

  <label>رقم الدلفري / الهاتف</label>
  <input id="phone" inputmode="tel" placeholder="مثال: 07701234567">

  <label>رقم الطلب الحالي</label>
  <input id="orderId" placeholder="مثال: 1052">

  <label>مكان الطلب / عنوان الزبون</label>
  <div class="location-tabs">
    <button id="textMode" class="location-tab active" type="button">✍️ كتابة العنوان</button>
    <button id="mapMode" class="location-tab" type="button">📍 تحديد على الخريطة</button>
  </div>

  <div id="textLocationBox">
    <input id="orderLocation" placeholder="مثال: حي الجمعة - قرب المدرسة">
  </div>

  <div id="mapLocationBox" hidden>
    <div id="orderMap"></div>
    <div class="map-help">اضغط على موقع الزبون في الخريطة، أو استخدم موقعك الحالي.</div>
    <button id="myLocationBtn" type="button" class="btn btn-dark full">📍 استخدام موقعي الحالي</button>
    <div id="selectedLocation" class="selected-location">لم يتم تحديد موقع الطلب بعد</div>
  </div>

  <div class="order-status-box">
    <label>حالة الطلب</label>
    <div class="status-actions">
      <button type="button" data-order-status="received" class="status-btn active">📦 تم الاستلام</button>
      <button type="button" data-order-status="on_route" class="status-btn">🛵 خرج للتوصيل</button>
      <button type="button" data-order-status="arrived" class="status-btn">📍 وصل للزبون</button>
      <button type="button" data-order-status="delivered" class="status-btn">✅ تم التسليم</button>
    </div>
  </div>

  <div class="grid">
    <button id="startBtn" class="btn btn-primary">🟢 بدء الدوام والتتبع</button>
    <button id="stopBtn" class="btn btn-danger" disabled>🔴 إنهاء الدوام</button>
  </div>

  <div id="status" class="status">الحالة: خارج الدوام</div>

  <div class="mini-grid">
    <div class="stat-card"><span class="muted small">آخر تحديث</span><strong id="lastUpdate">—</strong></div>
    <div class="stat-card"><span class="muted small">مدة التوصيل</span><strong id="deliveryTimer">—</strong></div>
  </div>

  <div id="coords" class="muted small coords"></div>
  <div class="note">أبقِ الصفحة مفتوحة أثناء الدوام لضمان استمرار تحديث الموقع.</div>
</section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getDatabase, ref, set, update, onDisconnect, push } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import { firebaseConfig, firebaseReady } from "./firebase-config.js";

const $ = id => document.getElementById(id);
const name = $("driverName");
const phone = $("phone");
const order = $("orderId");
const place = $("orderLocation");
const start = $("startBtn");
const stop = $("stopBtn");
const statusEl = $("status");
const dot = $("liveDot");
const deliveryTimer = $("deliveryTimer");

["driverName","phone","orderId","orderLocation"].forEach(k => $(k).value = localStorage.getItem(k) || "");

let orderLat = Number(localStorage.getItem("orderLat")) || null;
let orderLng = Number(localStorage.getItem("orderLng")) || null;
let locationMode = localStorage.getItem("locationMode") || "text";
let orderStatus = localStorage.getItem("orderStatus") || "received";
let deliveryStartedAt = Number(localStorage.getItem("deliveryStartedAt")) || null;
let watchId = null;
let driverId = null;
const app = firebaseReady ? initializeApp(firebaseConfig) : null;
const auth = app ? getAuth(app) : null;
const db = app ? getDatabase(app) : null;
let authReady = false;

if (firebaseReady) {
  onAuthStateChanged(auth, async user => {
    if (user) {
      driverId = user.uid;
      authReady = true;
      start.disabled = false;
      if (statusEl.textContent.includes("جاري تسجيل الدخول")) setShiftStatus("خارج الدوام");
    } else {
      start.disabled = true;
      setShiftStatus("جاري تسجيل الدخول...");
      try { await signInAnonymously(auth); }
      catch(e){ console.error(e); setShiftStatus("تعذر تسجيل الدخول"); }
    }
  });
}

function setShiftStatus(text, on=false) {
  statusEl.textContent = "الحالة: " + text;
  dot.className = "live-dot " + (on ? "on" : "off");
}

function statusLabel(s) {
  return {received:"تم الاستلام",on_route:"خرج للتوصيل",arrived:"وصل للزبون",delivered:"تم التسليم"}[s] || "تم الاستلام";
}

function values() {
  return {
    name: name.value.trim(),
    phone: phone.value.trim(),
    orderId: order.value.trim(),
    orderLocation: place.value.trim(),
    orderLocationMode: locationMode,
    orderLat: locationMode === "map" ? orderLat : null,
    orderLng: locationMode === "map" ? orderLng : null,
    orderStatus,
    deliveryStartedAt
  };
}

function saveLocal() {
  localStorage.setItem("driverName", name.value.trim());
  localStorage.setItem("phone", phone.value.trim());
  localStorage.setItem("orderId", order.value.trim());
  localStorage.setItem("orderLocation", place.value.trim());
  localStorage.setItem("orderStatus", orderStatus);
  if (deliveryStartedAt) localStorage.setItem("deliveryStartedAt", deliveryStartedAt);
  else localStorage.removeItem("deliveryStartedAt");
}

async function saveLive() {
  saveLocal();
  if (db && watchId !== null) {
    await update(ref(db, "drivers/" + driverId), {...values(), updatedAt:Date.now()});
  }
}

let orderMap = null;
let orderMarker = null;

function selectPoint(lat,lng) {
  orderLat = lat; orderLng = lng;
  localStorage.setItem("orderLat", lat);
  localStorage.setItem("orderLng", lng);
  if (orderMarker) orderMarker.setLatLng([lat,lng]);
  else orderMarker = L.marker([lat,lng]).addTo(orderMap);
  $("selectedLocation").textContent = "تم تحديد الموقع: " + lat.toFixed(5) + ", " + lng.toFixed(5);
  orderMap.panTo([lat,lng]);
  saveLive();
}

function initOrderMap() {
  if (orderMap) return;
  orderMap = L.map("orderMap").setView([30.50,47.78],12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(orderMap);
  orderMap.on("click", e => selectPoint(e.latlng.lat,e.latlng.lng));
  if (orderLat && orderLng) selectPoint(orderLat,orderLng);
}

function setMode(mode) {
  locationMode = mode;
  localStorage.setItem("locationMode", mode);
  $("textMode").classList.toggle("active", mode === "text");
  $("mapMode").classList.toggle("active", mode === "map");
  $("textLocationBox").hidden = mode !== "text";
  $("mapLocationBox").hidden = mode !== "map";
  if (mode === "map") {
    initOrderMap();
    setTimeout(() => orderMap.invalidateSize(),100);
  }
  saveLive();
}

function renderStatusButtons() {
  document.querySelectorAll("[data-order-status]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.orderStatus === orderStatus);
  });
}

async function setOrderStatus(next) {
  const previous = orderStatus;
  orderStatus = next;

  if (next === "on_route" && !deliveryStartedAt) {
    deliveryStartedAt = Date.now();
  }

  if (next === "delivered") {
    const deliveredAt = Date.now();
    const snapshot = {
      ...values(),
      id: driverId,
      deliveredAt,
      durationMs: deliveryStartedAt ? deliveredAt - deliveryStartedAt : null
    };
    if (db && order.value.trim()) {
      await set(push(ref(db,"deliveryHistory/"+driverId)), snapshot);
    }
  }

  renderStatusButtons();
  await saveLive();

  if (next === "delivered") {
    setTimeout(async () => {
      order.value = "";
      place.value = "";
      orderStatus = "received";
      deliveryStartedAt = null;
      orderLat = null;
      orderLng = null;
      localStorage.removeItem("orderLat");
      localStorage.removeItem("orderLng");
      renderStatusButtons();
      saveLocal();
      if (db && watchId !== null) await update(ref(db,"drivers/"+driverId), {...values(),updatedAt:Date.now()});
    }, 700);
  }
}

$("textMode").onclick = () => setMode("text");
$("mapMode").onclick = () => setMode("map");
$("myLocationBtn").onclick = () => navigator.geolocation.getCurrentPosition(
  p => selectPoint(p.coords.latitude,p.coords.longitude),
  () => alert("تعذر تحديد موقعك"),
  {enableHighAccuracy:true}
);

document.querySelectorAll("[data-order-status]").forEach(btn => btn.onclick = () => setOrderStatus(btn.dataset.orderStatus));

setMode(locationMode);
renderStatusButtons();

if (!firebaseReady) {
  setShiftStatus("بانتظار ربط Firebase");
  start.disabled = true;
} else {
  start.disabled = true;
  setShiftStatus("جاري تسجيل الدخول...");
}

start.onclick = () => {
  if (!authReady || !driverId) return alert("انتظر لحظة حتى يكتمل تسجيل الدخول");
  if (!name.value.trim()) return alert("اكتب اسم الدلفري");
  if (locationMode === "map" && order.value.trim() && (!orderLat || !orderLng)) return alert("حدد مكان الطلب على الخريطة");
  if (!navigator.geolocation) return alert("الجهاز لا يدعم تحديد الموقع");

  saveLocal();

  const driverRef = ref(db,"drivers/"+driverId);
  onDisconnect(driverRef).update({online:false,shift:false,updatedAt:Date.now()});

  name.disabled = true;
  start.disabled = true;
  stop.disabled = false;
  setShiftStatus("جاري تحديد الموقع...");

  watchId = navigator.geolocation.watchPosition(async p => {
    const now = Date.now();
    const d = {
      id:driverId,
      ...values(),
      lat:p.coords.latitude,
      lng:p.coords.longitude,
      accuracy:Math.round(p.coords.accuracy||0),
      speed:p.coords.speed||0,
      heading:p.coords.heading||0,
      online:true,
      shift:true,
      updatedAt:now
    };

    await set(driverRef,d);
    setShiftStatus("في الدوام — التتبع يعمل",true);
    $("lastUpdate").textContent = new Date(now).toLocaleTimeString("ar-IQ");
    $("coords").textContent = `الموقع: ${d.lat.toFixed(6)}, ${d.lng.toFixed(6)}`;
  }, e => {
    setShiftStatus("تعذر الحصول على الموقع");
    alert("اسمح باستخدام الموقع ثم حاول مجددًا. " + e.message);
    name.disabled = false;
    start.disabled = false;
    stop.disabled = true;
  }, {enableHighAccuracy:true,maximumAge:3000,timeout:15000});
};

[phone,order,place].forEach(el => el.onchange = saveLive);

stop.onclick = async () => {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  await update(ref(db,"drivers/"+driverId), {...values(),online:false,shift:false,updatedAt:Date.now()});
  setShiftStatus("خارج الدوام");
  name.disabled = false;
  start.disabled = false;
  stop.disabled = true;
};

setInterval(() => {
  if (!deliveryStartedAt || orderStatus === "delivered") {
    deliveryTimer.textContent = "—";
    return;
  }
  const m = Math.floor((Date.now()-deliveryStartedAt)/60000);
  deliveryTimer.textContent = m + " دقيقة";
},1000);
</script>
</body>
</html>
