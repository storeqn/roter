<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><title>تطبيق الدلفري</title></head><body><main class="container narrow"><section class="card"><div class="driver-head"><div><div class="badge">تطبيق الدلفري</div><h1>الدوام والتتبع 🛵</h1></div><div id="liveDot" class="live-dot off"></div></div><p class="muted">أدخل بياناتك والطلب الحالي، ثم ابدأ الدوام والتتبع.</p>
<label>اسم الدلفري</label><input id="driverName" placeholder="مثال: أحمد">
<label>رقم الدلفري / الهاتف</label><input id="phone" inputmode="tel" placeholder="مثال: 07701234567">
<label>رقم الطلب الحالي</label><input id="orderId" placeholder="مثال: 1052">
<label>مكان الطلب / عنوان الزبون</label><div class="location-tabs"><button id="textMode" class="location-tab active" type="button">✍️ كتابة العنوان</button><button id="mapMode" class="location-tab" type="button">📍 تحديد على الخريطة</button></div><div id="textLocationBox"><input id="orderLocation" placeholder="مثال: حي الجمعة - قرب المدرسة"></div><div id="mapLocationBox" hidden><div id="orderMap"></div><div class="map-help">اضغط على مكان الزبون في الخريطة.</div><button id="myLocationBtn" type="button" class="btn btn-dark full">📍 استخدام موقعي الحالي</button><div id="selectedLocation" class="selected-location">لم يتم تحديد موقع الطلب بعد</div></div>
<div class="grid"><button id="startBtn" class="btn btn-primary">🟢 بدء الدوام والتتبع</button><button id="stopBtn" class="btn btn-danger" disabled>🔴 إنهاء الدوام</button></div><div id="status" class="status">الحالة: خارج الدوام</div><div class="mini-grid"><div class="stat-card"><span class="muted small">آخر تحديث</span><strong id="lastUpdate">—</strong></div><div class="stat-card"><span class="muted small">دقة GPS</span><strong id="accuracy">—</strong></div></div><div id="coords" class="muted small coords"></div><div class="note">أبقِ الصفحة مفتوحة أثناء الدوام لضمان استمرار تحديث الموقع.</div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import {getDatabase,ref,set,update,onDisconnect} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";import {firebaseConfig,firebaseReady} from "./firebase-config.js";
const $=id=>document.getElementById(id),name=$("driverName"),phone=$("phone"),order=$("orderId"),place=$("orderLocation"),start=$("startBtn"),stop=$("stopBtn"),status=$("status"),dot=$("liveDot");["driverName","phone","orderId","orderLocation"].forEach(k=>$(k).value=localStorage.getItem(k)||"");
let orderLat=Number(localStorage.getItem("orderLat"))||null,orderLng=Number(localStorage.getItem("orderLng"))||null,locationMode=localStorage.getItem("locationMode")||"text";let wid=null,id=localStorage.getItem("driverId");if(!id){id="drv_"+crypto.randomUUID().slice(0,8);localStorage.setItem("driverId",id)}
const db=firebaseReady?getDatabase(initializeApp(firebaseConfig)):null;function st(t,on=false){status.textContent="الحالة: "+t;dot.className="live-dot "+(on?"on":"off")}
if(!firebaseReady){st("بانتظار ربط Firebase");start.disabled=true}
let orderMap=null,orderMarker=null;
function selectPoint(lat,lng){orderLat=lat;orderLng=lng;localStorage.setItem("orderLat",lat);localStorage.setItem("orderLng",lng);if(orderMarker)orderMarker.setLatLng([lat,lng]);else orderMarker=L.marker([lat,lng]).addTo(orderMap);$("selectedLocation").textContent="تم تحديد الموقع: "+lat.toFixed(5)+", "+lng.toFixed(5);saveLive()}
function initOrderMap(){if(orderMap)return;orderMap=L.map("orderMap").setView([30.50,47.78],12);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(orderMap);orderMap.on("click",e=>selectPoint(e.latlng.lat,e.latlng.lng));if(orderLat&&orderLng)selectPoint(orderLat,orderLng)}
function setMode(m){locationMode=m;localStorage.setItem("locationMode",m);$("textMode").classList.toggle("active",m==="text");$("mapMode").classList.toggle("active",m==="map");$("textLocationBox").hidden=m!=="text";$("mapLocationBox").hidden=m!=="map";if(m==="map"){initOrderMap();setTimeout(()=>orderMap.invalidateSize(),100)}}
$("textMode").onclick=()=>setMode("text");$("mapMode").onclick=()=>setMode("map");$("myLocationBtn").onclick=()=>navigator.geolocation.getCurrentPosition(p=>selectPoint(p.coords.latitude,p.coords.longitude),()=>alert("تعذر تحديد الموقع"),{enableHighAccuracy:true});setMode(locationMode);
function vals(){return{name:name.value.trim(),phone:phone.value.trim(),orderId:order.value.trim(),orderLocation:place.value.trim(),orderLocationMode:locationMode,orderLat:locationMode==="map"?orderLat:null,orderLng:locationMode==="map"?orderLng:null}}
function save(){localStorage.setItem("driverName",name.value.trim());localStorage.setItem("phone",phone.value.trim());localStorage.setItem("orderId",order.value.trim());localStorage.setItem("orderLocation",place.value.trim())} async function saveLive(){save();if(db&&wid!==null)await update(ref(db,"drivers/"+id),{...vals(),updatedAt:Date.now()})}
start.onclick=()=>{if(!name.value.trim())return alert("اكتب اسم الدلفري");if(locationMode==="map"&&order.value.trim()&&(!orderLat||!orderLng))return alert("حدد مكان الطلب على الخريطة");if(!navigator.geolocation)return alert("الجهاز لا يدعم تحديد الموقع");save();const r=ref(db,"drivers/"+id);onDisconnect(r).update({online:false,shift:false,updatedAt:Date.now()});name.disabled=true;start.disabled=true;stop.disabled=false;st("جاري تحديد الموقع...");
wid=navigator.geolocation.watchPosition(async p=>{const now=Date.now(),v=vals(),d={id,...v,lat:p.coords.latitude,lng:p.coords.longitude,accuracy:Math.round(p.coords.accuracy||0),speed:p.coords.speed||0,heading:p.coords.heading||0,online:true,shift:true,updatedAt:now};await set(r,d);st("في الدوام — التتبع يعمل",true);$("lastUpdate").textContent=new Date(now).toLocaleTimeString("ar-IQ");$("accuracy").textContent=d.accuracy+" م";$("coords").textContent=`الموقع: ${d.lat.toFixed(6)}, ${d.lng.toFixed(6)}`},e=>{st("تعذر الحصول على الموقع");alert("اسمح باستخدام الموقع ثم حاول مجددًا. "+e.message);name.disabled=false;start.disabled=false;stop.disabled=true},{enableHighAccuracy:true,maximumAge:3000,timeout:15000})};
[phone,order,place].forEach(el=>el.onchange=saveLive);
stop.onclick=async()=>{if(wid!==null)navigator.geolocation.clearWatch(wid);wid=null;await update(ref(db,"drivers/"+id),{...vals(),online:false,shift:false,updatedAt:Date.now()});st("خارج الدوام");name.disabled=false;start.disabled=false;stop.disabled=true};
</script></body></html>
