<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>تطبيق الدلفري</title>
</head>
<body>
<main class="container narrow">
  <section class="card">
    <div class="driver-head">
      <div>
        <div class="badge">تطبيق الدلفري</div>
        <h1>الدوام والتتبع 🛵</h1>
      </div>
      <div id="liveDot" class="live-dot off"></div>
    </div>

    <p class="muted">اكتب اسمك مرة واحدة، ثم اضغط بدء الدوام. سيظهر موقعك مباشرة في لوحة المطعم.</p>

    <label>اسم الدلفري</label>
    <input id="driverName" autocomplete="name" placeholder="مثال: أحمد">

    <label>رقم الطلب الحالي <span class="muted small">(اختياري)</span></label>
    <input id="orderId" inputmode="numeric" placeholder="مثال: 1052">

    <div class="grid">
      <button id="startBtn" class="btn btn-primary">🟢 بدء الدوام والتتبع</button>
      <button id="stopBtn" class="btn btn-danger" disabled>🔴 إنهاء الدوام</button>
    </div>

    <div id="status" class="status">الحالة: خارج الدوام</div>

    <div class="mini-grid">
      <div class="stat-card">
        <span class="muted small">آخر تحديث</span>
        <strong id="lastUpdate">—</strong>
      </div>
      <div class="stat-card">
        <span class="muted small">دقة GPS</span>
        <strong id="accuracy">—</strong>
      </div>
    </div>

    <div id="coords" class="muted small coords"></div>
    <div class="note">مهم: أبقِ الصفحة مفتوحة أثناء الدوام. المتصفح قد يوقف التتبع عند قفل الشاشة أو وضع التطبيق في الخلفية.</div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, set, update, onDisconnect } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import { firebaseConfig, firebaseReady } from "./firebase-config.js";

const statusEl = document.getElementById("status");
const coordsEl = document.getElementById("coords");
const driverName = document.getElementById("driverName");
const orderId = document.getElementById("orderId");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const lastUpdate = document.getElementById("lastUpdate");
const accuracy = document.getElementById("accuracy");
const liveDot = document.getElementById("liveDot");

driverName.value = localStorage.getItem("driverName") || "";
orderId.value = localStorage.getItem("orderId") || "";

let watchId = null;
let driverId = localStorage.getItem("driverId");
if (!driverId) {
  driverId = "drv_" + crypto.randomUUID().slice(0,8);
  localStorage.setItem("driverId", driverId);
}

function setStatus(text, live=false) {
  statusEl.textContent = "الحالة: " + text;
  liveDot.classList.toggle("off", !live);
  liveDot.classList.toggle("on", live);
}

if (!firebaseReady) {
  setStatus("بانتظار ربط Firebase");
  startBtn.disabled = true;
}

let db = null;
if (firebaseReady) db = getDatabase(initializeApp(firebaseConfig));

startBtn.addEventListener("click", () => {
  const name = driverName.value.trim();
  const order = orderId.value.trim();

  if (!name) return alert("اكتب اسم الدلفري");
  if (!navigator.geolocation) return alert("هذا الجهاز لا يدعم تحديد الموقع");

  localStorage.setItem("driverName", name);
  localStorage.setItem("orderId", order);

  const driverRef = ref(db, "drivers/" + driverId);
  onDisconnect(driverRef).update({ online:false, shift:false, updatedAt:Date.now() });

  driverName.disabled = true;
  startBtn.disabled = true;
  stopBtn.disabled = false;
  setStatus("جاري تحديد الموقع...", false);

  watchId = navigator.geolocation.watchPosition(async (pos) => {
    const now = Date.now();
    const data = {
      id: driverId,
      name,
      orderId: order,
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      accuracy: Math.round(pos.coords.accuracy || 0),
      speed: pos.coords.speed || 0,
      heading: pos.coords.heading || 0,
      online: true,
      shift: true,
      updatedAt: now
    };

    await set(driverRef, data);
    setStatus("في الدوام — التتبع يعمل", true);
    lastUpdate.textContent = new Date(now).toLocaleTimeString("ar-IQ");
    accuracy.textContent = data.accuracy + " م";
    coordsEl.textContent = `الموقع: ${data.lat.toFixed(6)}, ${data.lng.toFixed(6)}`;
  }, (err) => {
    setStatus("تعذر الحصول على الموقع", false);
    alert("اسمح للموقع باستخدام GPS ثم حاول مجددًا. " + err.message);
    driverName.disabled = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }, { enableHighAccuracy:true, maximumAge:3000, timeout:15000 });
});

orderId.addEventListener("change", async () => {
  const order = orderId.value.trim();
  localStorage.setItem("orderId", order);
  if (db && watchId !== null) {
    await update(ref(db, "drivers/" + driverId), { orderId:order, updatedAt:Date.now() });
  }
});

stopBtn.addEventListener("click", async () => {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;

  await update(ref(db, "drivers/" + driverId), {
    online:false,
    shift:false,
    orderId:orderId.value.trim(),
    updatedAt:Date.now()
  });

  setStatus("خارج الدوام", false);
  driverName.disabled = false;
  startBtn.disabled = false;
  stopBtn.disabled = true;
});
</script>
</body>
</html>
