<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ذوق - الإدارة">
  <meta name="theme-color" content="#071322">
  <title>مطعم ذوق - الإدارة</title>
  <link rel="apple-touch-icon" href="./zooq-icon.png?v=2">
  <link rel="icon" type="image/png" href="./zooq-icon.png?v=2">
  <link rel="manifest" href="./zooq-admin.webmanifest?v=2">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#071322;overflow:hidden}
    #app{border:0;width:100%;height:100%;display:block;background:#071322}
  </style>
</head>
<body>
  <iframe id="app" src="./admin.html?v=2" allow="geolocation; clipboard-read; clipboard-write" title="مطعم ذوق - الإدارة"></iframe>
  <script>
    const frame=document.getElementById('app');
    function applyZooqBrand(){
      try{
        const d=frame.contentDocument;
        if(!d)return;
        d.title='مطعم ذوق - الإدارة';
        d.querySelectorAll('img').forEach(img=>{
          const src=img.getAttribute('src')||'';
          const alt=img.getAttribute('alt')||'';
          if(src.includes('admin-icon-') || alt.includes('الياسري')){
            img.src='./zooq-icon.png?v=2';
            img.alt='شعار مطعم ذوق';
          }
        });
        const apple=d.querySelector('meta[name="apple-mobile-web-app-title"]');
        if(apple)apple.setAttribute('content','ذوق - الإدارة');
      }catch(e){}
    }
    frame.addEventListener('load',()=>{
      applyZooqBrand();
      setTimeout(applyZooqBrand,300);
      setTimeout(applyZooqBrand,1200);
    });
  </script>
</body>
</html>
