name: Build Zooq Driver APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-zooq-driver-apk.yml'
      - 'android-app/**'
      - 'android-zooq-admin-app/zooq-icon.b64'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Zooq driver app
        run: |
          cp -R android-app android-zooq-driver-app
          sed -i 's/com.storeqn.deliverydriver/com.storeqn.zooqdriver/g' android-zooq-driver-app/app/build.gradle
          sed -i 's/package com.storeqn.deliverydriver;/package com.storeqn.zooqdriver;/g' android-zooq-driver-app/app/src/main/java/com/storeqn/deliverydriver/MainActivity.java
          sed -i 's/package com.storeqn.deliverydriver;/package com.storeqn.zooqdriver;/g' android-zooq-driver-app/app/src/main/java/com/storeqn/deliverydriver/LocationForegroundService.java
          printf '%s\n' '<resources>' '    <string name="app_name">مطعم ذوق - دلفري السائق</string>' '</resources>' > android-zooq-driver-app/app/src/main/res/values/strings.xml

      - name: Generate Zooq launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          base64 -d android-zooq-admin-app/zooq-icon.b64 > zooq-icon.png
          mkdir -p android-zooq-driver-app/app/src/main/res/mipmap-mdpi android-zooq-driver-app/app/src/main/res/mipmap-hdpi android-zooq-driver-app/app/src/main/res/mipmap-xhdpi android-zooq-driver-app/app/src/main/res/mipmap-xxhdpi android-zooq-driver-app/app/src/main/res/mipmap-xxxhdpi
          convert zooq-icon.png -resize 48x48! android-zooq-driver-app/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert zooq-icon.png -resize 72x72! android-zooq-driver-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert zooq-icon.png -resize 96x96! android-zooq-driver-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert zooq-icon.png -resize 144x144! android-zooq-driver-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert zooq-icon.png -resize 192x192! android-zooq-driver-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android-zooq-driver-app/app/src/main/res/mipmap-mdpi/ic_launcher.png android-zooq-driver-app/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android-zooq-driver-app/app/src/main/res/mipmap-hdpi/ic_launcher.png android-zooq-driver-app/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android-zooq-driver-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png android-zooq-driver-app/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android-zooq-driver-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android-zooq-driver-app/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android-zooq-driver-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android-zooq-driver-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Build debug APK
        working-directory: android-zooq-driver-app
        run: gradle assembleDebug

      - name: Rename APK
        run: cp android-zooq-driver-app/app/build/outputs/apk/debug/app-debug.apk ZooqDeliveryDriver.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZooqDeliveryDriver-APK
          path: ZooqDeliveryDriver.apk
