name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - 'admin-icon-512.png'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      app_name:
        description: 'اسم التطبيق الظاهر على الهاتف'
        required: false
        default: 'مطعم الياسري - دلفري'
      restaurant_id:
        description: 'معرّف المطعم لاستخدامه في اسم الملف'
        required: false
        default: 'yasri'
      icon_url:
        description: 'رابط مباشر لشعار المطعم PNG/JPG (اختياري)'
        required: false
        default: 'https://i.top4top.io/p_3900rusb40.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare restaurant branding
        env:
          INPUT_APP_NAME: ${{ github.event.inputs.app_name }}
          INPUT_RESTAURANT_ID: ${{ github.event.inputs.restaurant_id }}
          INPUT_ICON_URL: ${{ github.event.inputs.icon_url }}
        run: |
          APP_NAME="${INPUT_APP_NAME:-مطعم الياسري - دلفري}"
          RESTAURANT_ID="${INPUT_RESTAURANT_ID:-yasri}"
          ICON_URL="${INPUT_ICON_URL:-https://i.top4top.io/p_3900rusb40.png}"
          SAFE_ID=$(printf '%s' "$RESTAURANT_ID" | tr -cd 'A-Za-z0-9._-' | cut -c1-40)
          [ -n "$SAFE_ID" ] || SAFE_ID="generic"
          echo "SAFE_ID=$SAFE_ID" >> "$GITHUB_ENV"

          APP_NAME="$APP_NAME" python3 - <<'PY'
          import os, html
          app_name = os.environ.get('APP_NAME') or 'مطعم الياسري - دلفري'
          value = html.escape(app_name, quote=False)
          path = 'android-app/app/src/main/res/values/strings.xml'
          with open(path, 'w', encoding='utf-8') as f:
              f.write('<resources>\n    <string name="app_name">'+value+'</string>\n</resources>\n')
          PY

          sudo apt-get update
          sudo apt-get install -y imagemagick
          if [ -n "$ICON_URL" ]; then
            curl -fL --retry 2 --connect-timeout 15 "$ICON_URL" -o restaurant-icon
            convert restaurant-icon -auto-orient -resize 512x512^ -gravity center -extent 512x512 restaurant-icon-512.png
          else
            cp admin-icon-512.png restaurant-icon-512.png
          fi

          mkdir -p android-app/app/src/main/res/mipmap-mdpi android-app/app/src/main/res/mipmap-hdpi android-app/app/src/main/res/mipmap-xhdpi android-app/app/src/main/res/mipmap-xxhdpi android-app/app/src/main/res/mipmap-xxxhdpi
          convert restaurant-icon-512.png -resize 48x48! android-app/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert restaurant-icon-512.png -resize 72x72! android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert restaurant-icon-512.png -resize 96x96! android-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert restaurant-icon-512.png -resize 144x144! android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert restaurant-icon-512.png -resize 192x192! android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android-app/app/src/main/res/mipmap-mdpi/ic_launcher.png android-app/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png android-app/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png android-app/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk "DeliveryDriver-${SAFE_ID}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DeliveryDriver-${{ env.SAFE_ID }}-APK
          path: DeliveryDriver-${{ env.SAFE_ID }}.apk
