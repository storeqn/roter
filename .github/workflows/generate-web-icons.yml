name: Generate Web App Icons
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'admin-icon-yasri.png'
      - '.github/workflows/generate-web-icons.yml'

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Yasri PNG icon sizes
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          identify admin-icon-yasri.png
          convert admin-icon-yasri.png -resize 180x180! admin-icon-180.png
          convert admin-icon-yasri.png -resize 192x192! admin-icon-192.png
          convert admin-icon-yasri.png -resize 512x512! admin-icon-512.png
          identify admin-icon-180.png admin-icon-192.png admin-icon-512.png
          test $(stat -c%s admin-icon-180.png) -gt 5000
          test $(stat -c%s admin-icon-192.png) -gt 5000
          test $(stat -c%s admin-icon-512.png) -gt 10000
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-icon-180.png admin-icon-192.png admin-icon-512.png
          git diff --cached --quiet || git commit -m "Generate Yasri PWA icons"
          git pull --rebase origin main
          git push origin main

# trigger-real-icon
