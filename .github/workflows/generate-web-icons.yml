name: Generate Web App Icons
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'yasri-icon-source.jpg'
      - '.github/workflows/generate-web-icons.yml'
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Yasri PNG icon sizes
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          identify yasri-icon-source.jpg
          convert yasri-icon-source.jpg -resize 180x180! admin-icon-180.png
          convert yasri-icon-source.jpg -resize 192x192! admin-icon-192.png
          convert yasri-icon-source.jpg -resize 512x512! admin-icon-512.png
          identify admin-icon-180.png admin-icon-192.png admin-icon-512.png
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-icon-180.png admin-icon-192.png admin-icon-512.png
          git diff --cached --quiet || git commit -m "Generate Yasri app icons from verified source"
          git pull --rebase origin main
          git push origin main
