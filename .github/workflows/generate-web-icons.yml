name: Generate Web App Icons
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/icon-src-*.b64'
      - '.github/workflows/generate-web-icons.yml'

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Yasri icon from verified source
        run: |
          cat .github/icon-src-1.b64 .github/icon-src-2.b64 .github/icon-src-3.b64 .github/icon-src-4.b64 .github/icon-src-5.b64 | base64 -d > /tmp/yasri-icon.png
          echo "8819bdadd7baec721f2bb22836323c35881393bbc24d48dd03549de521919750  /tmp/yasri-icon.png" | sha256sum -c -
          python3 - <<'PY'
          from PIL import Image
          PY
      - name: Generate PNG icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          identify /tmp/yasri-icon.png
          convert /tmp/yasri-icon.png -resize 180x180! admin-icon-180.png
          convert /tmp/yasri-icon.png -resize 192x192! admin-icon-192.png
          convert /tmp/yasri-icon.png -resize 512x512! admin-icon-512.png
          identify admin-icon-180.png admin-icon-192.png admin-icon-512.png
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-icon-180.png admin-icon-192.png admin-icon-512.png
          git diff --cached --quiet || git commit -m "Install real Yasri app icons"
          git pull --rebase origin main
          git push origin main
