name: Rebuild Yasri Icon Source
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/icon-src-*.b64'
      - '.github/workflows/rebuild-icon-source.yml'
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact PNG
        run: |
          echo "3bf4120893c1c72e4c0967096d10ca20756baed93ef1e6921bedf05a67b69362  .github/icon-src-1.b64" | sha256sum -c -
          echo "03ec48a36adec4ab04a05f1cdb7fdd616757f78e68c3d0cdd015f72f6886368f  .github/icon-src-2.b64" | sha256sum -c -
          echo "d744994c18ae8007d1c6c0e2bb1e997aa1476b6e4a1e891ad3ca5e5ae45ea127  .github/icon-src-3.b64" | sha256sum -c -
          echo "8d4bd7093fd65c869fd4954e56367b9305ca5f1c8e2e458d37777a177a9944ff  .github/icon-src-4.b64" | sha256sum -c -
          echo "aa66cd6b63a9457ba4fddec362ec40c86a3d21980b5732fc95e0246611ef9355  .github/icon-src-5.b64" | sha256sum -c -
          cat .github/icon-src-1.b64 .github/icon-src-2.b64 .github/icon-src-3.b64 .github/icon-src-4.b64 .github/icon-src-5.b64 | base64 -d > admin-icon-yasri.png
          echo "8819bdadd7baec721f2bb22836323c35881393bbc24d48dd03549de521919750  admin-icon-yasri.png" | sha256sum -c -
          file admin-icon-yasri.png
      - name: Commit real icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-icon-yasri.png
          git diff --cached --quiet || git commit -m "Install verified Yasri icon source"
          git pull --rebase origin main
          git push origin main
