<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="إدارة الدلفري">
<link rel="manifest" href="admin-manifest.webmanifest?v=8">
<link rel="apple-touch-icon" sizes="256x256" href="yasri-delivery-logo.svg?v=8">
<link rel="apple-touch-icon-precomposed" href="yasri-delivery-logo.svg?v=8">
<link rel="icon" type="image/svg+xml" href="yasri-delivery-logo.svg?v=8">
<link rel="stylesheet" href="style.css?v=8">
<title>دخول إدارة المطعم</title>
</head>
<body>
<main class="login-shell">
  <section class="login-card">
    <div class="login-icon">🔐</div>
    <h1>دخول إدارة المطعم</h1>
    <p class="muted">أدخل كود الإدارة فقط.</p>
    <input id="adminCode" type="password" autocomplete="current-password" placeholder="كود الإدارة">
    <button id="loginBtn" class="btn btn-primary full" disabled>دخول</button>
    <div id="loginMsg" class="login-msg">جاري تجهيز الدخول...</div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import { firebaseConfig } from "./firebase-config.js";

const ADMIN_CODE = "حسين فالح";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const code = document.getElementById("adminCode");
const btn = document.getElementById("loginBtn");
const msg = document.getElementById("loginMsg");
let uid = null;

async function bootstrapAdmin(){
  try{
    const r = ref(db,"accessCodes/"+ADMIN_CODE);
    const s = await get(r);
    if(!s.exists()){
      await set(r,{role:"admin",name:"إدارة المطعم",phone:"",enabled:true,createdAt:Date.now()});
    }
  }catch(e){}
}

async function verifyExistingSession(){
  try{
    const ss = await get(ref(db,"sessions/"+uid));
    if(!ss.exists()) return false;
    const savedCode = ss.val().code;
    const cs = await get(ref(db,"accessCodes/"+savedCode));
    const v = cs.val();
    if(v && v.enabled === true && v.role === "admin"){
      location.replace("admin.html");
      return true;
    }
  }catch(e){}
  return false;
}

onAuthStateChanged(auth, async user => {
  if(!user){
    try{ await signInAnonymously(auth); }
    catch(e){ msg.textContent="تعذر تسجيل الدخول إلى النظام"; }
    return;
  }
  uid = user.uid;
  await bootstrapAdmin();
  if(await verifyExistingSession()) return;
  btn.disabled = false;
  msg.textContent = "";
});

async function login(){
  const entered = code.value.trim();
  if(!entered) return msg.textContent="اكتب كود الإدارة";
  if(!uid) return msg.textContent="انتظر لحظة...";
  btn.disabled=true; msg.textContent="جاري التحقق...";
  try{
    await set(ref(db,"sessions/"+uid),{code:entered,createdAt:Date.now()});
    const snap = await get(ref(db,"accessCodes/"+entered));
    const data = snap.val();
    if(data && data.enabled === true && data.role === "admin"){
      location.replace("admin.html");
      return;
    }
    await remove(ref(db,"sessions/"+uid));
    msg.textContent="كود الإدارة غير صحيح";
  }catch(e){
    console.error(e);
    msg.textContent="كود الإدارة غير صحيح";
  }finally{
    btn.disabled=false;
  }
}
btn.onclick=login;
code.addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script>
</body>
</html>
