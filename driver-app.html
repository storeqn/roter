<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الياسري دلفري">
<link rel="manifest" href="manifest.webmanifest?v=20">
<link rel="icon" type="image/png" sizes="192x192" href="admin-icon-192.png?v=20">
<link rel="apple-touch-icon" sizes="180x180" href="admin-icon-180.png?v=20">
<link rel="stylesheet" href="style.css?v=8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>تطبيق الدلفري</title>
</head>
<body>
<main class="container narrow">
<section class="card">
  <div class="driver-head"><div style="display:flex;align-items:center;gap:12px"><img src="admin-icon-512.png?v=20" alt="شعار الياسري" style="width:64px;height:64px;border-radius:16px;object-fit:cover"><div><div class="badge">تطبيق الدلفري</div><h1>الدوام والتتبع 🛵</h1></div></div><div id="liveDot" class="live-dot off"></div></div>
  <div class="driver-identity"><strong id="identityName">—</strong><span id="identityPhone" class="muted">—</span><button id="driverLogoutBtn" class="btn btn-dark">خروج</button></div>

  <label>اسم الدلفري</label><input id="driverName" readonly>
  <label>رقم الدلفري / الهاتف</label><input id="phone" readonly>
  <label>رقم الطلب الحالي</label><input id="orderId" placeholder="مثال: 1052">

  <label>مكان الطلب / عنوان الزبون</label>
  <div class="location-tabs"><button id="textMode" class="location-tab active" type="button">✍️ كتابة العنوان</button><button id="mapMode" class="location-tab" type="button">📍 تحديد على الخريطة</button></div>
  <div id="textLocationBox"><input id="orderLocation" placeholder="مثال: حي الجمعة - قرب المدرسة"></div>
  <div id="mapLocationBox" hidden><div id="orderMap"></div><div class="map-help">اضغط على موقع الزبون في الخريطة، أو استخدم موقعك الحالي.</div><button id="myLocationBtn" type="button" class="btn btn-dark full">📍 استخدام موقعي الحالي</button><div id="selectedLocation" class="selected-location">لم يتم تحديد موقع الطلب بعد</div></div>

  <div class="order-status-box"><label>حالة الطلب</label><div class="status-actions"><button type="button" data-order-status="received" class="status-btn active">📦 تم الاستلام</button><button type="button" data-order-status="on_route" class="status-btn">🛵 خرج للتوصيل</button><button type="button" data-order-status="arrived" class="status-btn">📍 وصل للزبون</button><button type="button" data-order-status="delivered" class="status-btn">✅ تم التسليم</button></div></div>

  <div class="grid"><button id="startBtn" class="btn btn-primary">🟢 بدء الدوام والتتبع</button><button id="stopBtn" class="btn btn-danger" disabled>🔴 إنهاء الدوام</button></div>
  <div id="status" class="status">الحالة: خارج الدوام</div>
  <div class="mini-grid"><div class="stat-card"><span class="muted small">آخر تحديث</span><strong id="lastUpdate">—</strong></div><div class="stat-card"><span class="muted small">مدة التوصيل</span><strong id="deliveryTimer">—</strong></div></div>
  <div id="coords" class="muted small coords"></div><div class="note">على تطبيق أندرويد يستمر إرسال الموقع حتى عند قفل الشاشة بعد بدء الدوام.</div>
</section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getDatabase, ref, get, set, update, remove, onDisconnect, push, onValue } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import { firebaseConfig } from "./firebase-config.js";

const $=id=>document.getElementById(id), app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const name=$("driverName"),phone=$("phone"),order=$("orderId"),place=$("orderLocation"),start=$("startBtn"),stop=$("stopBtn"),statusEl=$("status"),dot=$("liveDot"),deliveryTimer=$("deliveryTimer");
let uid=null,code=null,authReady=false,watchId=null,orderMap=null,orderMarker=null,accessUnsub=null;
let orderLat=Number(localStorage.getItem("orderLat"))||null,orderLng=Number(localStorage.getItem("orderLng"))||null,locationMode=localStorage.getItem("locationMode")||"text",orderStatus=localStorage.getItem("orderStatus")||"received",deliveryStartedAt=Number(localStorage.getItem("deliveryStartedAt"))||null;
order.value=localStorage.getItem("orderId")||"";place.value=localStorage.getItem("orderLocation")||"";

function setShiftStatus(text,on=false){statusEl.textContent="الحالة: "+text;dot.className="live-dot "+(on?"on":"off")}
function values(){return{name:name.value.trim(),phone:phone.value.trim(),orderId:order.value.trim(),orderLocation:place.value.trim(),orderLocationMode:locationMode,orderLat:locationMode==="map"?orderLat:null,orderLng:locationMode==="map"?orderLng:null,orderStatus,deliveryStartedAt}}
function saveLocal(){localStorage.setItem("orderId",order.value.trim());localStorage.setItem("orderLocation",place.value.trim());localStorage.setItem("orderStatus",orderStatus);if(deliveryStartedAt)localStorage.setItem("deliveryStartedAt",deliveryStartedAt);else localStorage.removeItem("deliveryStartedAt")}
async function saveLive(){
  saveLocal();
  const meta={...values(),code,updatedAt:Date.now()};
  if(window.AndroidBridge){
    try{window.AndroidBridge.updateMeta(JSON.stringify(meta))}catch(e){}
    return;
  }
  if(watchId!==null)await update(ref(db,"drivers/"+uid),meta);
}

async function loadAccess(){
  const ss=await get(ref(db,"sessions/"+uid));
  if(!ss.exists())return false;
  code=ss.val().code;
  const cs=await get(ref(db,"accessCodes/"+code));
  const v=cs.val();
  if(!(v&&v.enabled===true&&v.role==="driver"))return false;
  name.value=v.name||"";phone.value=v.phone||"";$("identityName").textContent=v.name||"دلفري";$("identityPhone").textContent=v.phone||"";
  authReady=true;
  if(window.AndroidBridge){
    try{window.AndroidBridge.updateMeta(JSON.stringify({...values(),code}))}catch(e){}
  }
  if(accessUnsub)accessUnsub();
  accessUnsub=onValue(ref(db,"accessCodes/"+code),snap=>{
    const latest=snap.val();
    if(!latest||latest.enabled!==true||latest.role!=="driver"){
      if(watchId!==null)navigator.geolocation.clearWatch(watchId);
      alert("تم إيقاف أو حذف كود الدلفري.");
      location.replace("driver.html");
    }
  });
  return true;
}

onAuthStateChanged(auth,async user=>{
  if(!user){try{await signInAnonymously(auth)}catch(e){location.replace("driver.html")}return}
  uid=user.uid;
  try{
    if(!(await loadAccess()))location.replace("driver.html");
  }catch(e){console.error(e);location.replace("driver.html")}
});

$("driverLogoutBtn").onclick=async()=>{
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);
  if(window.AndroidBridge){try{window.AndroidBridge.stopTracking()}catch(e){}}
  try{await remove(ref(db,"sessions/"+uid))}catch(e){}
  await signOut(auth);
  location.replace("driver.html");
};

function selectPoint(lat,lng){orderLat=lat;orderLng=lng;localStorage.setItem("orderLat",lat);localStorage.setItem("orderLng",lng);if(orderMarker)orderMarker.setLatLng([lat,lng]);else orderMarker=L.marker([lat,lng]).addTo(orderMap);$("selectedLocation").textContent="تم تحديد الموقع: "+lat.toFixed(5)+", "+lng.toFixed(5);orderMap.panTo([lat,lng]);saveLive()}
function initOrderMap(){if(orderMap)return;orderMap=L.map("orderMap").setView([30.50,47.78],12);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(orderMap);orderMap.on("click",e=>selectPoint(e.latlng.lat,e.latlng.lng));if(orderLat&&orderLng)selectPoint(orderLat,orderLng)}
function setMode(mode){locationMode=mode;localStorage.setItem("locationMode",mode);$("textMode").classList.toggle("active",mode==="text");$("mapMode").classList.toggle("active",mode==="map");$("textLocationBox").hidden=mode!=="text";$("mapLocationBox").hidden=mode!=="map";if(mode==="map"){initOrderMap();setTimeout(()=>orderMap.invalidateSize(),100)}saveLive()}
function renderStatusButtons(){document.querySelectorAll("[data-order-status]").forEach(btn=>btn.classList.toggle("active",btn.dataset.orderStatus===orderStatus))}
async function setOrderStatus(next){orderStatus=next;if(next==="on_route"&&!deliveryStartedAt)deliveryStartedAt=Date.now();if(next==="delivered"){const deliveredAt=Date.now(),snapshot={...values(),id:uid,deliveredAt,durationMs:deliveryStartedAt?deliveredAt-deliveryStartedAt:null};if(order.value.trim())await set(push(ref(db,"deliveryHistory/"+uid)),snapshot)}renderStatusButtons();await saveLive();if(next==="delivered")setTimeout(async()=>{order.value="";place.value="";orderStatus="received";deliveryStartedAt=null;orderLat=null;orderLng=null;localStorage.removeItem("orderLat");localStorage.removeItem("orderLng");renderStatusButtons();saveLocal();if(watchId!==null)await update(ref(db,"drivers/"+uid),{...values(),updatedAt:Date.now()})},700)}

$("textMode").onclick=()=>setMode("text");$("mapMode").onclick=()=>setMode("map");$("myLocationBtn").onclick=()=>navigator.geolocation.getCurrentPosition(p=>selectPoint(p.coords.latitude,p.coords.longitude),()=>alert("تعذر تحديد موقعك"),{enableHighAccuracy:true});document.querySelectorAll("[data-order-status]").forEach(btn=>btn.onclick=()=>setOrderStatus(btn.dataset.orderStatus));setMode(locationMode);renderStatusButtons();

start.onclick=()=>{
  if(!authReady||!uid)return alert("انتظر لحظة حتى يكتمل تسجيل الدخول");
  if(locationMode==="map"&&order.value.trim()&&(!orderLat||!orderLng))return alert("حدد مكان الطلب على الخريطة");
  if(!navigator.geolocation)return alert("الجهاز لا يدعم تحديد الموقع");
  saveLocal();
  const driverRef=ref(db,"drivers/"+uid);
  const nativeTracking=!!window.AndroidBridge;
  if(nativeTracking){
    try{
      await remove(driverRef);
      window.AndroidBridge.startTracking(code,name.value.trim(),phone.value.trim(),JSON.stringify({...values(),code}));
    }catch(e){}
  }else{
    onDisconnect(driverRef).update({online:false,shift:false,updatedAt:Date.now()});
  }
  start.disabled=true;stop.disabled=false;
  setShiftStatus(nativeTracking?"في الدوام — التتبع بالخلفية يعمل":"جاري تحديد الموقع...",nativeTracking);
  watchId=navigator.geolocation.watchPosition(async p=>{
    const now=Date.now(),d={id:uid,code,...values(),lat:p.coords.latitude,lng:p.coords.longitude,accuracy:Math.round(p.coords.accuracy||0),speed:p.coords.speed||0,heading:p.coords.heading||0,online:true,shift:true,updatedAt:now};
    if(!nativeTracking)await set(driverRef,d);
    setShiftStatus(nativeTracking?"في الدوام — يعمل حتى مع قفل الشاشة":"في الدوام — التتبع يعمل",true);
    $("lastUpdate").textContent=new Date(now).toLocaleTimeString("ar-IQ");
    $("coords").textContent=`الموقع: ${d.lat.toFixed(6)}, ${d.lng.toFixed(6)}`;
  },e=>{
    if(!nativeTracking){
      setShiftStatus("تعذر الحصول على الموقع");alert("اسمح باستخدام الموقع ثم حاول مجددًا. "+e.message);start.disabled=false;stop.disabled=true;
    }
  },{enableHighAccuracy:true,maximumAge:3000,timeout:15000});
};
[order,place].forEach(el=>el.onchange=saveLive);
stop.onclick=async()=>{
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;
  if(window.AndroidBridge){
    try{window.AndroidBridge.updateMeta(JSON.stringify({...values(),code}));window.AndroidBridge.stopTracking()}catch(e){}
  }else{
    await update(ref(db,"drivers/"+uid),{...values(),code,online:false,shift:false,updatedAt:Date.now()});
  }
  setShiftStatus("خارج الدوام");start.disabled=false;stop.disabled=true;
};
setInterval(()=>{if(!deliveryStartedAt||orderStatus==="delivered"){deliveryTimer.textContent="—";return}deliveryTimer.textContent=Math.floor((Date.now()-deliveryStartedAt)/60000)+" دقيقة"},1000);
</script>
</body>
</html>
