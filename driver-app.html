<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الياسري دلفري">
<link rel="manifest" href="manifest.webmanifest?v=21">
<link rel="icon" type="image/png" sizes="192x192" href="admin-icon-192.png?v=21">
<link rel="apple-touch-icon" sizes="180x180" href="admin-icon-180.png?v=21">
<link rel="stylesheet" href="style.css?v=14">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>تطبيق الدلفري</title>
<style>
body{min-height:100vh}.container.narrow{max-width:720px;padding:8px 8px 90px}.container.narrow>.card{padding:12px;border-radius:18px}.compact-head{margin:0 0 10px;padding:4px 2px}.compact-head img{width:48px!important;height:48px!important;border-radius:13px!important;object-fit:cover}.compact-head h1{font-size:22px!important;margin:0 0 4px}.compact-logout{min-height:38px!important;padding:7px 12px!important}.driver-state-line{font-size:13px;color:#aebbd0;display:flex;align-items:center;gap:6px}.driver-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0 14px}.driver-summary .stat-card{padding:10px 6px;text-align:center}.driver-summary .stat-card span{display:block;font-size:11px;color:#94a3b8}.driver-summary .stat-card strong{display:block;font-size:15px;margin-top:4px}.multi-order-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0}.multi-order-head h2{font-size:19px!important}.active-orders-list{display:grid;gap:9px;margin-bottom:10px}.active-order-card{border:1px solid rgba(148,163,184,.25);background:rgba(8,24,44,.72);border-radius:15px;padding:11px}.active-order-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}.active-order-no{font-size:17px;font-weight:800}.active-order-address{color:#aebbd0;font-size:13px;line-height:1.6;margin-top:3px}.active-order-state{font-size:12px;padding:5px 9px;border-radius:999px;background:rgba(148,163,184,.12);white-space:nowrap}.active-order-state.on-route{background:rgba(34,197,94,.16);color:#86efac}.active-order-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.active-order-actions .btn{min-height:44px}.active-order-actions .btn:disabled{opacity:.42}.empty-orders{padding:18px;text-align:center;border:1px dashed rgba(148,163,184,.25);border-radius:16px;color:#94a3b8}.add-order-toggle{margin:10px 0;min-height:48px!important}.new-order-box{margin:10px 0;padding:12px;border:1px solid rgba(148,163,184,.22);border-radius:18px}.new-order-title{display:flex;align-items:center;justify-content:space-between}.new-order-title h3{margin:0}.details-toggle{width:100%;background:transparent;color:#aebbd0;border:0;text-align:right;padding:5px 0 10px;font:inherit}.shift-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.return-btn{margin-top:8px!important}.tracking-strip{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding:9px 10px;border:1px solid rgba(148,163,184,.18);border-radius:12px;color:#94a3b8;font-size:12px}.coords{font-size:10px!important;text-align:center;margin-top:5px}#orderMap{height:300px}@media(max-width:420px){.driver-summary .stat-card span{font-size:10px}.driver-summary .stat-card strong{font-size:13px}}
</style>
</head>
<body>
<main class="container narrow"><section class="card">
<div class="driver-head compact-head"><div style="display:flex;align-items:center;gap:10px"><img src="admin-icon-512.png?v=21" alt="شعار الياسري"><div><h1 id="identityName">—</h1><div id="status" class="driver-state-line"><span id="liveDot" class="live-dot off"></span> خارج الدوام</div></div></div><button id="driverLogoutBtn" class="btn btn-dark compact-logout">خروج</button></div>
<input id="driverName" type="hidden"><input id="phone" type="hidden"><span id="identityPhone" hidden></span>
<div class="driver-summary"><div class="stat-card"><span>📦 الطلبات</span><strong id="summaryOrders">0</strong></div><div class="stat-card"><span>🛵 قيد التوصيل</span><strong id="summaryRoute">0</strong></div><div class="stat-card"><span>💵 النقد معي</span><strong id="cashWithDriver">0 د.ع</strong></div></div>
<div class="multi-order-head"><h2 style="margin:0">طلباتي الحالية</h2><span id="activeOrdersCount" class="badge">0 طلب</span></div>
<div id="activeOrdersList" class="active-orders-list"></div>
<button id="toggleNewOrderBtn" type="button" class="btn btn-dark full add-order-toggle">➕ إضافة طلب جديد</button>
<div class="new-order-box" id="newOrderBox" hidden><div class="new-order-title"><h3>إضافة طلب جديد</h3><button id="closeNewOrderBtn" type="button" class="btn btn-dark">✕</button></div><label>رقم الطلب</label><input id="orderId" placeholder="مثال: 1052"><label>رقم هاتف الزبون <span class="muted small">(اختياري)</span></label><input id="customerPhone" inputmode="tel" placeholder="مثال: 0770..."><button id="toggleExtrasBtn" type="button" class="details-toggle">تفاصيل إضافية ▾</button><div id="extraFields" hidden><label>ملاحظات الطلب</label><input id="orderNotes" placeholder="مثال: قرب الجامع"></div><label>مبلغ الطلب</label><input id="orderAmount" inputmode="numeric" placeholder="مثال: 25000"><label>طريقة الدفع</label><div class="location-tabs"><button id="cashMode" class="location-tab active" type="button">💵 نقدي</button><button id="paidMode" class="location-tab" type="button">✅ مدفوع</button></div><label>مكان الطلب / عنوان الزبون</label><div class="location-tabs"><button id="textMode" class="location-tab active" type="button">✍️ كتابة العنوان</button><button id="mapMode" class="location-tab" type="button">📍 تحديد على الخريطة</button></div><div id="textLocationBox"><input id="orderLocation" placeholder="مثال: حي الجمعة - قرب المدرسة"></div><div id="mapLocationBox" hidden><div id="orderMap"></div><button id="myLocationBtn" type="button" class="btn btn-dark full">📍 استخدام موقعي الحالي</button><div id="selectedLocation" class="selected-location">لم يتم تحديد موقع الطلب بعد</div></div><button id="addOrderBtn" type="button" class="btn btn-primary full">➕ إضافة الطلب إلى قائمتي</button></div>
<div class="shift-controls"><button id="startBtn" class="btn btn-primary">🟢 بدء الدوام</button><button id="stopBtn" class="btn btn-danger" disabled>🔴 إنهاء الدوام</button></div>
<button id="returnBtn" class="btn btn-dark full return-btn" hidden disabled>↩️ العودة للمطعم</button>
<div class="tracking-strip"><span>📍 آخر تحديث: <b id="lastUpdate">—</b></span><span>⏱️ <b id="deliveryTimer">—</b></span></div><div id="coords" class="muted small coords"></div>
</section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getDatabase, ref, get, set, update, remove, onDisconnect, push, onValue } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import { firebaseConfig } from "./firebase-config.js";
const $=id=>document.getElementById(id),app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const name=$("driverName"),phone=$("phone"),order=$("orderId"),customerPhone=$("customerPhone"),orderNotes=$("orderNotes"),orderAmount=$("orderAmount"),place=$("orderLocation"),start=$("startBtn"),stop=$("stopBtn"),returnBtn=$("returnBtn"),statusEl=$("status"),deliveryTimer=$("deliveryTimer"),cashWithDriver=$("cashWithDriver");
let uid=null,code=null,licenseId=null,authReady=false,watchId=null,orderMap=null,orderMarker=null,accessUnsub=null,deviceUnsub=null,trackingStarted=false,cashCollected=0;
let orderLat=null,orderLng=null,locationMode="text",paymentMode="cash",returningToRestaurant=false,returnStartedAt=null,lastHistoryKey=null,activeOrders=[];
function storageKey(base){return code?base+"_"+code:null}
function loadLocalForDriver(){activeOrders=[];cashCollected=0;try{const k=storageKey("activeOrders"),ck=storageKey("cashCollected"),hk=storageKey("lastHistoryKey"),rk=storageKey("returnStartedAt");if(k){const v=JSON.parse(localStorage.getItem(k)||"[]");if(Array.isArray(v))activeOrders=v}if(ck)cashCollected=Number(localStorage.getItem(ck)||0)||0;if(hk)lastHistoryKey=localStorage.getItem(hk)||null;if(rk){returnStartedAt=Number(localStorage.getItem(rk)||0)||null;returningToRestaurant=!!returnStartedAt}}catch(e){}}
function saveLocal(){const k=storageKey("activeOrders"),ck=storageKey("cashCollected"),hk=storageKey("lastHistoryKey"),rk=storageKey("returnStartedAt");if(k)localStorage.setItem(k,JSON.stringify(activeOrders));if(ck)cashCollected=Number(cashCollected)||0;if(ck)localStorage.setItem(ck,String(cashCollected));if(hk&&lastHistoryKey)localStorage.setItem(hk,lastHistoryKey);if(rk){if(returnStartedAt)localStorage.setItem(rk,String(returnStartedAt));else localStorage.removeItem(rk)}if(cashWithDriver)cashWithDriver.textContent=cashCollected.toLocaleString("ar-IQ")+" د.ع"}
function driverState(){if(!authReady||!trackingStarted)return "offline";if(activeOrders.some(o=>o.status==="on_route"))return "delivering";if(returningToRestaurant)return "returning";return "available"}
function setShiftStatus(text,on=false){statusEl.innerHTML='<span class="live-dot '+(on?'on':'off')+'"></span> '+text}
function refreshAutoState(){const s=driverState(),t={available:"🟢 متاح",delivering:"🛵 لديه طلب",returning:"🟠 عائد للمطعم",offline:"⚫ خارج الدوام"}[s]||"—";setShiftStatus(t,s!=="offline");return s}
function legacyOrder(){return activeOrders.find(o=>o.status==="on_route")||activeOrders[0]||null}
function values(){const current=legacyOrder();return{licenseId,name:name.value.trim(),phone:phone.value.trim(),activeOrders,activeOrdersCount:activeOrders.length,orderId:current?.orderId||"",orderLocation:current?.orderLocation||"",orderLocationMode:current?.orderLocationMode||"text",orderLat:typeof current?.orderLat==="number"?current.orderLat:null,orderLng:typeof current?.orderLng==="number"?current.orderLng:null,orderStatus:current?.status||"",deliveryStartedAt:current?.deliveryStartedAt||null,driverState:driverState(),returningToRestaurant,returnStartedAt}}
async function saveLive(){saveLocal();const meta={...values(),code,updatedAt:Date.now()};if(window.AndroidBridge){try{window.AndroidBridge.updateMeta(JSON.stringify(meta))}catch(e){}return}if(watchId!==null&&licenseId){await update(ref(db,"restaurants/"+licenseId+"/drivers/"+uid),meta)}}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function orderMapsUrl(o){if(typeof o.orderLat==="number"&&typeof o.orderLng==="number")return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(o.orderLat+","+o.orderLng);if(o.orderLocation)return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(o.orderLocation);return ""}
function renderActiveOrders(){const box=$("activeOrdersList");$("activeOrdersCount").textContent=activeOrders.length+" طلب";$("summaryOrders").textContent=activeOrders.length;$("summaryRoute").textContent=activeOrders.filter(o=>o.status==="on_route").length;if(!activeOrders.length){box.innerHTML='<div class="empty-orders">لا توجد طلبات حالية</div>';returnBtn.hidden=!trackingStarted;returnBtn.disabled=!trackingStarted;returnBtn.textContent=returningToRestaurant?"✅ وصلت للمطعم":"↩️ العودة للمطعم";if(returningToRestaurant&&returnStartedAt)deliveryTimer.textContent="عودة: "+Math.max(0,Math.floor((Date.now()-returnStartedAt)/60000))+" دقيقة";else deliveryTimer.textContent="—";return}returnBtn.hidden=true;box.innerHTML="";activeOrders.forEach(o=>{const card=document.createElement("div"),inRoute=o.status==="on_route",mins=o.deliveryStartedAt?Math.max(0,Math.floor((Date.now()-o.deliveryStartedAt)/60000)):0,mapUrl=orderMapsUrl(o);card.className="active-order-card";card.innerHTML=`<div class="active-order-top"><div><div class="active-order-no">📦 طلب #${escapeHtml(o.orderId||"—")}</div><div class="active-order-address">${escapeHtml(o.orderLocation||"بدون عنوان")}</div></div><span class="active-order-state ${inRoute?"on-route":""}">${inRoute?"🛵 جاري التوصيل":"جاهز للتوصيل"}</span></div><div class="active-order-actions"><button class="btn btn-primary start-order" ${inRoute?"disabled":""}>🛵 توصيل الطلب</button><button class="btn btn-success done-order" ${inRoute?"":"disabled"}>✅ تم تسليم الطلب</button></div>${mapUrl?'<a class="btn btn-dark full" style="margin-top:8px" target="_blank" rel="noopener" href="'+escapeHtml(mapUrl)+'">🗺️ فتح موقع الطلب</a>':""}${inRoute?'<div class="muted small" style="margin-top:8px">⏱️ مدة هذا الطلب: '+mins+' دقيقة</div>':""}`;card.querySelector(".start-order").onclick=()=>startOrderDelivery(o.key);card.querySelector(".done-order").onclick=()=>finishOrderDelivery(o.key);box.appendChild(card)});const times=activeOrders.filter(o=>o.deliveryStartedAt).map(o=>Math.floor((Date.now()-o.deliveryStartedAt)/60000));deliveryTimer.textContent=times.length?Math.max(...times)+" دقيقة":"—"}
async function startOrderDelivery(key){const o=activeOrders.find(x=>x.key===key);if(!o)return;o.status="on_route";if(!o.deliveryStartedAt)o.deliveryStartedAt=Date.now();returningToRestaurant=false;returnStartedAt=null;refreshAutoState();renderActiveOrders();await saveLive()}
async function finishOrderDelivery(key){const idx=activeOrders.findIndex(x=>x.key===key);if(idx<0)return;const o=activeOrders[idx];if(o.status!=="on_route")return alert("اضغط توصيل الطلب أولاً");const deliveredAt=Date.now(),snapshot={...o,name:name.value.trim(),phone:phone.value.trim(),id:uid,code,licenseId,deliveredAt,durationMs:o.deliveryStartedAt?deliveredAt-o.deliveryStartedAt:null,status:"delivered"};if(uid){lastHistoryKey=push(ref(db,"deliveryHistory/"+uid)).key;const writes=[set(ref(db,"deliveryHistory/"+uid+"/"+lastHistoryKey),snapshot)];if(licenseId)writes.push(set(ref(db,"restaurants/"+licenseId+"/deliveryHistory/"+uid+"/"+lastHistoryKey),snapshot));await Promise.all(writes)}if(o.paymentMode==="cash")cashCollected+=Number(o.amount)||0;activeOrders.splice(idx,1);refreshAutoState();renderActiveOrders();await saveLive()}
async function addOrder(){const orderId=order.value.trim(),orderLocation=place.value.trim(),customerPhoneValue=customerPhone.value.trim(),notesValue=orderNotes.value.trim(),amountValue=Math.max(0,Number(String(orderAmount.value||"").replace(/[^0-9.]/g,""))||0);if(!orderId)return alert("اكتب رقم الطلب");if(locationMode==="text"&&!orderLocation)return alert("اكتب عنوان الزبون");if(locationMode==="map"&&(!orderLat||!orderLng))return alert("حدد مكان الطلب على الخريطة");activeOrders.push({key:"o_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),orderId,orderLocation,customerPhone:customerPhoneValue,notes:notesValue,amount:amountValue,paymentMode,orderLocationMode:locationMode,orderLat:locationMode==="map"?orderLat:null,orderLng:locationMode==="map"?orderLng:null,status:"ready",deliveryStartedAt:null,addedAt:Date.now()});returningToRestaurant=false;returnStartedAt=null;saveLocal();renderActiveOrders();await saveLive();order.value="";customerPhone.value="";orderNotes.value="";orderAmount.value="";place.value="";orderLat=null;orderLng=null}
async function finishReturn(){if(!returnStartedAt)return;const returnedAt=Date.now(),patch={returnStartedAt,returnedAt,returnDurationMs:returnedAt-returnStartedAt};if(lastHistoryKey&&uid){const writes=[update(ref(db,"deliveryHistory/"+uid+"/"+lastHistoryKey),patch)];if(licenseId)writes.push(update(ref(db,"restaurants/"+licenseId+"/deliveryHistory/"+uid+"/"+lastHistoryKey),patch));await Promise.all(writes)}returningToRestaurant=false;returnStartedAt=null;saveLocal();refreshAutoState();renderActiveOrders();await saveLive()}
returnBtn.onclick=async()=>{if(activeOrders.length)return alert("أنهِ الطلبات الحالية أولاً");if(returningToRestaurant)return finishReturn();returningToRestaurant=true;returnStartedAt=Date.now();returnBtn.textContent="✅ وصلت للمطعم";refreshAutoState();renderActiveOrders();await saveLive()};
async function loadAccess(){const ss=await get(ref(db,"sessions/"+uid));if(!ss.exists())return false;const session=ss.val()||{};code=session.code;const cs=await get(ref(db,"accessCodes/"+code)),v=cs.val();if(!(v&&v.enabled===true&&v.role==="driver"))return false;licenseId=session.licenseId||v.licenseId||"";const deviceId=session.deviceId||localStorage.getItem("roterDeviceId")||"",localDeviceId=localStorage.getItem("roterDeviceId")||"";if(!licenseId||!deviceId||!localDeviceId||deviceId!==localDeviceId)return false;const deviceSnap=await get(ref(db,"licenses/"+licenseId+"/devices/"+deviceId));if(!(deviceSnap.val()?.approved===true))return false;name.value=v.name||"";phone.value=v.phone||"";$("identityName").textContent=v.name||"دلفري";loadLocalForDriver();saveLocal();renderActiveOrders();authReady=true;return true}
onAuthStateChanged(auth,async user=>{if(!user){try{await signInAnonymously(auth)}catch(e){location.replace("driver.html?v=31")}return}uid=user.uid;try{if(!(await loadAccess()))location.replace("driver.html?v=31")}catch(e){console.error(e);location.replace("driver.html?v=31")}});
$("driverLogoutBtn").onclick=async()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId);try{await remove(ref(db,"sessions/"+uid))}catch(e){}await signOut(auth);location.replace("driver.html?v=31")};
function selectPoint(lat,lng){orderLat=lat;orderLng=lng;if(orderMarker)orderMarker.setLatLng([lat,lng]);else orderMarker=L.marker([lat,lng]).addTo(orderMap);$("selectedLocation").textContent="تم تحديد الموقع: "+lat.toFixed(5)+", "+lng.toFixed(5);orderMap.panTo([lat,lng])}
function initOrderMap(){if(orderMap)return;orderMap=L.map("orderMap").setView([30.50,47.78],12);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(orderMap);orderMap.on("click",e=>selectPoint(e.latlng.lat,e.latlng.lng))}
function setMode(mode){locationMode=mode;$("textMode").classList.toggle("active",mode==="text");$("mapMode").classList.toggle("active",mode==="map");$("textLocationBox").hidden=mode!=="text";$("mapLocationBox").hidden=mode!=="map";if(mode==="map"){initOrderMap();setTimeout(()=>orderMap.invalidateSize(),100)}}
$("textMode").onclick=()=>setMode("text");$("mapMode").onclick=()=>setMode("map");$("cashMode").onclick=()=>{paymentMode="cash";$("cashMode").classList.add("active");$("paidMode").classList.remove("active")};$("paidMode").onclick=()=>{paymentMode="paid";$("paidMode").classList.add("active");$("cashMode").classList.remove("active")};$("myLocationBtn").onclick=()=>navigator.geolocation.getCurrentPosition(p=>selectPoint(p.coords.latitude,p.coords.longitude),()=>alert("تعذر تحديد موقعك"),{enableHighAccuracy:true});$("addOrderBtn").onclick=async()=>{await addOrder();if(order.value==="")$("newOrderBox").hidden=true};$("toggleNewOrderBtn").onclick=()=>{$("newOrderBox").hidden=false};$("closeNewOrderBtn").onclick=()=>{$("newOrderBox").hidden=true};$("toggleExtrasBtn").onclick=()=>{const e=$("extraFields");e.hidden=!e.hidden;$("toggleExtrasBtn").textContent=e.hidden?"تفاصيل إضافية ▾":"تفاصيل إضافية ▴"};setMode("text");renderActiveOrders();
start.onclick=async()=>{if(!authReady||!uid)return alert("انتظر لحظة حتى يكتمل تسجيل الدخول");if(!navigator.geolocation)return alert("الجهاز لا يدعم تحديد الموقع");if(!licenseId)return alert("تعذر تحديد المطعم");const tenantDriverRef=ref(db,"restaurants/"+licenseId+"/drivers/"+uid),nativeTracking=!!window.AndroidBridge;if(nativeTracking){try{window.AndroidBridge.startTracking(code,name.value.trim(),phone.value.trim(),JSON.stringify({...values(),code}))}catch(e){}}else{onDisconnect(tenantDriverRef).update({online:false,shift:false,updatedAt:Date.now()})}trackingStarted=true;start.disabled=true;stop.disabled=false;renderActiveOrders();watchId=navigator.geolocation.watchPosition(async p=>{const now=Date.now(),d={id:uid,code,...values(),lat:p.coords.latitude,lng:p.coords.longitude,accuracy:Math.round(p.coords.accuracy||0),speed:p.coords.speed||0,heading:p.coords.heading||0,online:true,shift:true,updatedAt:now};if(!nativeTracking){await set(tenantDriverRef,d)}refreshAutoState();$("lastUpdate").textContent=new Date(now).toLocaleTimeString("ar-IQ");$("coords").textContent=`الموقع: ${d.lat.toFixed(6)}, ${d.lng.toFixed(6)}`},()=>{}, {enableHighAccuracy:true,maximumAge:3000,timeout:15000})};
stop.onclick=async()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;const stopped={...values(),code,online:false,shift:false,updatedAt:Date.now()};if(licenseId){try{await update(ref(db,"restaurants/"+licenseId+"/drivers/"+uid),stopped)}catch(e){}}trackingStarted=false;returningToRestaurant=false;returnStartedAt=null;saveLocal();setShiftStatus("⚫ خارج الدوام");start.disabled=false;stop.disabled=true;returnBtn.hidden=true};
setInterval(renderActiveOrders,15000);
</script>
</body>
</html>
