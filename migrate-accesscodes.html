<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>نقل أكواد الدخول</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}.wrap{max-width:560px;margin:auto;padding:16px}.card{background:#0d1b2d;border:1px solid #1f3552;border-radius:20px;padding:16px;margin-top:18px}h1,h2{margin:0 0 12px}.muted{color:#9fb0c7;font-size:13px;line-height:1.7}label{display:block;font-weight:700;margin:10px 0 6px}input{width:100%;min-height:48px;border:1px solid #2b4568;border-radius:12px;background:#081525;color:#fff;padding:11px;font-size:16px}.btn{width:100%;border:0;border-radius:12px;min-height:48px;padding:10px 14px;font-weight:800;font-size:15px;margin-top:12px}.primary{background:#2f7df6;color:#fff}.success{background:#169c59;color:#fff}.dark{background:#17283e;color:#fff}.hidden{display:none}.msg{margin-top:12px;padding:10px;border-radius:12px;background:#081525;line-height:1.7;white-space:pre-line}</style></head><body><div class="wrap"><section id="loginCard" class="card"><h2>دخول مالك النظام</h2><div class="muted">نقل أكواد السائقين إلى المسار الآمن الجديد مع التحقق من كل عملية كتابة.</div><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="btn primary">دخول</button><div id="loginMsg" class="msg hidden"></div></section><section id="migrationCard" class="card hidden"><h1>نقل أكواد السائقين</h1><div class="muted">لن يتم حذف أي كود قديم. بعد كل كتابة سيتم قراءة المسار الجديد والتأكد أن الكود موجود ومطابق.</div><button id="migrateBtn" class="btn success">ابدأ النقل والتحقق</button><button id="logoutBtn" class="btn dark">خروج</button><div id="result" class="msg hidden"></div></section></div><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import { getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";import { getDatabase,ref,get,set } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";import { firebaseConfig } from "./firebase-config.js";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);async function isOwner(uid){const s=await get(ref(db,"owners/"+uid));return s.exists()&&s.val()===true}function msg(id,text){const e=$(id);e.textContent=text;e.classList.remove("hidden")}function showOwner(){$("loginCard").classList.add("hidden");$("migrationCard").classList.remove("hidden")}function showLogin(){$("migrationCard").classList.add("hidden");$("loginCard").classList.remove("hidden")}$("loginBtn").onclick=async()=>{try{msg("loginMsg","جاري تسجيل الدخول...");const c=await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);if(!(await isOwner(c.user.uid))){await signOut(auth);return msg("loginMsg","هذا الحساب ليس مالك النظام.")}showOwner()}catch(e){console.error(e);msg("loginMsg","تعذر تسجيل الدخول: "+(e.code||e.message))}};$("logoutBtn").onclick=()=>signOut(auth);$("migrateBtn").onclick=async()=>{const btn=$("migrateBtn");btn.disabled=true;msg("result","جاري فحص الأكواد...");try{const user=auth.currentUser;if(!user||!(await isOwner(user.uid)))throw new Error("الحساب ليس مالك النظام");const snap=await get(ref(db,"accessCodes"));const all=snap.val()||{};const candidates=Object.entries(all).filter(([,v])=>v&&v.role==="driver"&&typeof v.licenseId==="string"&&v.licenseId);if(!candidates.length)throw new Error("لم أجد أي كود سائق مرتبط بمطعم في accessCodes");let verified=0;const lines=[];for(const [code,v] of candidates){const path="restaurantAccessCodes/"+v.licenseId+"/"+code;msg("result","جاري نقل والتحقق من الكود: "+code+"\nالمسار: "+path);await set(ref(db,path),{...v,licenseId:v.licenseId});const check=await get(ref(db,path));if(!check.exists())throw new Error("تم طلب الكتابة لكن الكود "+code+" غير موجود بعد القراءة");const saved=check.val()||{};if(saved.role!=="driver"||saved.licenseId!==v.licenseId)throw new Error("فشل التحقق من بيانات الكود "+code);verified++;lines.push("✓ "+code+" → "+v.licenseId)}const rootCheck=await get(ref(db,"restaurantAccessCodes"));if(!rootCheck.exists())throw new Error("المسار restaurantAccessCodes غير موجود بعد النقل");msg("result","تم النقل والتحقق فعليًا ✅\n"+lines.join("\n")+"\n\nعدد الأكواد المتحقق منها: "+verified+"\nلم يتم حذف أي بيانات قديمة.")}catch(e){console.error(e);msg("result","فشل النقل أو التحقق ❌\n"+(e.code||e.message||String(e))+"\n\nلم يتم حذف أي بيانات قديمة.")}finally{btn.disabled=false}};onAuthStateChanged(auth,async user=>{if(!user)return showLogin();try{if(await isOwner(user.uid))showOwner();else{await signOut(auth);showLogin()}}catch(e){console.error(e);showLogin()}});</script></body></html>
