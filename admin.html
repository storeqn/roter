<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="إدارة الدلفري">
<link rel="manifest" href="admin-manifest.webmanifest?v=21">
<link rel="apple-touch-icon" href="admin-icon-180.png?v=21">
<link rel="stylesheet" href="style.css?v=12">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>لوحة المطعم</title>
<style>
#map{height:360px}.admin-grid{display:grid;gap:12px}.code-form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}.driver-row,.code-row,.history-row{padding:12px;border:1px solid rgba(148,163,184,.2);border-radius:14px;margin:8px 0}.driver-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status-on{color:#86efac}.status-off{color:#94a3b8}.time-line{margin-top:7px;font-size:13px}.time-good{color:#86efac}.time-return{color:#fbbf24}.history-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.order-live{margin-top:9px;padding:10px;border-radius:12px;background:rgba(15,23,42,.6);border:1px solid rgba(148,163,184,.18);line-height:1.8}.scooter-marker{font-size:30px;line-height:34px;text-align:center;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));transform:translateY(-3px)}.leaflet-div-icon{background:transparent!important;border:0!important}.map-popup{min-width:210px;line-height:1.7}.map-popup .state{font-weight:700;margin-top:4px}.map-popup .order{margin-top:6px;padding-top:6px;border-top:1px solid #ddd}.map-health{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;padding:8px 10px;border-radius:10px;font-weight:700}.map-health.green{background:#dcfce7;color:#166534}.map-health.yellow{background:#fef3c7;color:#92400e}.map-health.gray{background:#e5e7eb;color:#374151}.status-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:6px;vertical-align:-1px;box-shadow:0 0 10px currentColor}.dot-green{background:#22c55e;color:#22c55e}.dot-yellow{background:#facc15;color:#facc15}.dot-gray{background:#94a3b8;color:#94a3b8}.status-box{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 6px;padding:9px 11px;border:1px solid rgba(148,163,184,.18);border-radius:12px;font-weight:700}.status-box.green{background:rgba(34,197,94,.10);color:#86efac;border-color:rgba(34,197,94,.35)}.status-box.yellow{background:rgba(250,204,21,.10);color:#fde047;border-color:rgba(250,204,21,.35)}.status-box.gray{background:rgba(148,163,184,.08);color:#cbd5e1}.status-sub{font-size:12px;font-weight:500;opacity:.85}.status-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}.legend-item{padding:10px 8px;border:1px solid rgba(148,163,184,.18);border-radius:12px;text-align:center;font-size:12px;line-height:1.6}.legend-item b{display:block;font-size:13px}.legend-green{color:#86efac}.legend-yellow{color:#fde047}.legend-gray{color:#cbd5e1}@media(max-width:700px){.code-form{grid-template-columns:1fr}.summary-grid{grid-template-columns:1fr 1fr}.status-legend{grid-template-columns:1fr 1fr 1fr}.legend-item{font-size:11px;padding:8px 5px}}
</style>
</head>
<body>
<main class="container" id="adminApp" hidden>
<header class="dashboard-head"><div><h1>لوحة المطعم 🛵</h1><div class="muted">بيانات هذا المطعم فقط</div></div><button id="logoutBtn" class="btn btn-dark">تسجيل الخروج</button></header>
<div class="summary-grid"><div class="summary-card"><span>👤 الإجمالي</span><strong id="totalCount">0</strong></div><div class="summary-card"><span>🟢 في الدوام</span><strong id="onlineCount">0</strong></div><div class="summary-card"><span>🛵 قيد التوصيل</span><strong id="activeDeliveryCount">0</strong></div><div class="summary-card"><span>✅ تم اليوم</span><strong id="todayDeliveredCount">0</strong></div></div>
<section class="map-card"><div id="map"></div></section>
<div class="status-legend"><div class="legend-item legend-green"><b><span class="status-dot dot-green"></span>في الدوام</b>الخريطة تعمل</div><div class="legend-item legend-yellow"><b><span class="status-dot dot-yellow"></span>عائد للمطعم</b>في طريق العودة</div><div class="legend-item legend-gray"><b><span class="status-dot dot-gray"></span>خارج الدوام</b>الخريطة متوقفة</div></div>
<section class="drivers-panel"><div class="toolbar"><input id="searchDriver" placeholder="بحث عن دلفري أو طلب..."><button id="fitAllBtn" class="btn btn-primary">🗺️ عرض الجميع</button></div><h2>الدلفريات</h2><div id="driverList"></div></section>
<section class="drivers-panel"><h2>إدارة الدلفريين والأكواد</h2><div class="code-form"><input id="newDriverName" placeholder="اسم الدلفري"><input id="newDriverPhone" inputmode="tel" placeholder="رقم الهاتف"><input id="newDriverCode" placeholder="كود الدخول"><button id="addDriverCodeBtn" class="btn btn-primary">+ إضافة دلفري</button></div><div id="codeList"></div></section>
<section class="drivers-panel"><h2>سجل الطلبات المكتملة</h2><div id="historyList"></div></section>
</main>
<div id="adminLoading" class="login-shell"><section class="login-card"><div class="login-icon">🔐</div><h2>جاري التحقق من صلاحية الإدارة...</h2></section></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getDatabase, ref, onValue, get, set, update, remove } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import { firebaseConfig } from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let uid=null,adminLicenseId=null,drivers=[],history=[],codes=[],initialized=false,points=[];const markers={};
const map=L.map("map").setView([30.50,47.78],12);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
const scooterIcon=L.divIcon({className:"",html:'<div class="scooter-marker">🛵</div>',iconSize:[36,36],iconAnchor:[18,25],popupAnchor:[0,-24]});
function active(d){return !!(d.online&&d.shift&&Date.now()-(d.updatedAt||0)<90000&&typeof d.lat==="number"&&typeof d.lng==="number")}
function orders(d){const a=d?.activeOrders;if(Array.isArray(a))return a.filter(Boolean);if(a&&typeof a==="object")return Object.values(a).filter(Boolean);return d?.orderId?[{orderId:d.orderId,status:d.orderStatus,orderLocation:d.orderLocation,deliveryStartedAt:d.deliveryStartedAt}]:[]}
function minutes(ms){if(ms===null||ms===undefined)return "—";return Math.max(0,Math.floor(ms/60000))+" دقيقة"}
function stateText(d,os){const live=os.find(o=>o.status==="on_route");if(d.returningToRestaurant)return "↩️ عائد إلى المطعم";if(live)return "🛵 ذاهب لتوصيل الطلب";if(active(d))return "🟢 متاح لاستلام طلب";return "⚫ خارج الدوام"}
function statusInfo(d){if(d.returningToRestaurant&&active(d))return{kind:"yellow",label:"عائد إلى المطعم",map:"الخريطة تعمل — في طريق العودة"};if(active(d))return{kind:"green",label:"في الدوام",map:"الخريطة تعمل الآن"};return{kind:"gray",label:"خارج الدوام",map:"الخريطة متوقفة"}}
function currentOrder(os){return os.find(o=>o.status==="on_route")||os[0]||null}
async function verifyAdmin(){const s=await get(ref(db,"sessions/"+uid));if(!s.exists())return false;const session=s.val()||{},code=session.code,c=await get(ref(db,"accessCodes/"+code)),v=c.val();if(!(v&&v.role==="admin"&&v.enabled===true&&typeof v.licenseId==="string"&&v.licenseId))return false;adminLicenseId=v.licenseId;return session.licenseId===adminLicenseId}
function renderDrivers(){const q=$("searchDriver").value.trim().toLowerCase();$("driverList").innerHTML="";points=[];let on=0,route=0;const seen=new Set();drivers.forEach(([id,d])=>{seen.add(id);const isOn=active(d),os=orders(d),co=currentOrder(os),si=statusInfo(d);if(isOn)on++;route+=os.filter(o=>o.status==="on_route").length;const state=stateText(d,os);if(typeof d.lat==="number"&&typeof d.lng==="number"){if(!markers[id])markers[id]=L.marker([d.lat,d.lng],{icon:scooterIcon}).addTo(map);else{markers[id].setLatLng([d.lat,d.lng]);markers[id].setIcon(scooterIcon)}const popup=`<div dir="rtl" class="map-popup"><b>🛵 ${esc(d.name||"دلفري")}</b><br>📞 ${esc(d.phone||"—")}<div class="map-health ${si.kind}"><span><span class="status-dot dot-${si.kind}"></span>${si.label}</span><span>${si.kind==='gray'?'📴':'📡'}</span></div><div class="status-sub">${si.map}</div><div class="state">${state}</div>${co?`<div class="order"><b>📦 الطلب:</b> ${esc(co.orderId||"—")}<br><b>📍 المكان:</b> ${esc(co.orderLocation||"—")}</div>`:d.returningToRestaurant?'<div class="order">لا يوجد طلب حالي — السائق في طريق العودة للمطعم</div>':'<div class="order">لا يوجد طلب حالي</div>'}</div>`;markers[id].bindPopup(popup);if(isOn)points.push([d.lat,d.lng])}if(q&&!String(d.name||"").toLowerCase().includes(q)&&!String(d.phone||"").includes(q)&&!os.some(o=>String(o.orderId||"").toLowerCase().includes(q)))return;const liveOrder=os.find(o=>o.status==="on_route"&&o.deliveryStartedAt),deliveryElapsed=liveOrder?Date.now()-liveOrder.deliveryStartedAt:null,returnElapsed=d.returningToRestaurant&&d.returnStartedAt?Date.now()-d.returnStartedAt:null;const orderHtml=os.length?os.map((o,i)=>`<div class="order-live"><b>📦 ${os.length>1?'طلب '+(i+1)+': ':''}${esc(o.orderId||"بدون اسم")}</b><br>📍 ${esc(o.orderLocation||"المكان غير محدد")}<br>${o.status==="on_route"?'🛵 ذاهب للتوصيل':'⏳ بانتظار التوصيل'}</div>`).join(''):d.returningToRestaurant?'<div class="order-live">↩️ لا يوجد طلب حالي — عائد إلى المطعم</div>':'<div class="order-live">📭 لا يوجد طلب حالي</div>';const el=document.createElement("div");el.className="driver-row";el.innerHTML=`<strong>${esc(d.name||"دلفري")}</strong><div class="status-box ${si.kind}"><span><span class="status-dot dot-${si.kind}"></span>${si.label}</span><span class="status-sub">${si.map}</span></div><div class="muted small">${state}</div><div class="muted small">📞 ${esc(d.phone||"—")} · 📦 ${os.length} طلب</div>${orderHtml}${deliveryElapsed!==null?`<div class="time-line time-good">⏱️ مدة التوصيل الحالية: <b>${minutes(deliveryElapsed)}</b></div>`:''}${returnElapsed!==null?`<div class="time-line time-return">↩️ مدة العودة الحالية: <b>${minutes(returnElapsed)}</b></div>`:''}<div class="driver-actions"><button class="btn btn-primary focus" ${typeof d.lat==="number"?'':'disabled'}>عرض الموقع</button>${d.phone?`<a class="btn btn-dark" href="tel:${esc(d.phone)}">📞 اتصال</a>`:''}<button class="btn btn-danger delete">حذف</button></div>`;el.querySelector(".focus").onclick=()=>{if(markers[id]){map.setView(markers[id].getLatLng(),17);markers[id].openPopup()}};el.querySelector(".delete").onclick=()=>deleteDriver(id,d);$("driverList").appendChild(el)});Object.keys(markers).forEach(id=>{if(!seen.has(id)){map.removeLayer(markers[id]);delete markers[id]}});$("totalCount").textContent=drivers.length;$("onlineCount").textContent=on;$("activeDeliveryCount").textContent=route;if(!$("driverList").children.length)$("driverList").innerHTML='<div class="driver-row">لا توجد نتائج.</div>'}
async function deleteDriver(id,d){if(!confirm("حذف هذا الدلفري؟"))return;const code=String(d.code||"").trim();await Promise.all([remove(ref(db,"restaurants/"+adminLicenseId+"/drivers/"+id)),remove(ref(db,"sessions/"+id)),code?remove(ref(db,"accessCodes/"+code)):Promise.resolve()])}
function renderCodes(){$("codeList").innerHTML="";codes.filter(([,v])=>v&&v.role==="driver"&&v.licenseId===adminLicenseId).forEach(([code,v])=>{const el=document.createElement("div");el.className="code-row";el.innerHTML=`<strong>${esc(v.name||"دلفري")}</strong><div class="muted small">📞 ${esc(v.phone||"—")} · الكود: ${esc(code)} · ${v.enabled?'فعال':'متوقف'}</div><div class="driver-actions"><button class="btn btn-dark toggle">${v.enabled?'إيقاف':'تفعيل'}</button><button class="btn btn-danger del">حذف</button></div>`;el.querySelector(".toggle").onclick=()=>update(ref(db,"accessCodes/"+code),{enabled:!v.enabled});el.querySelector(".del").onclick=()=>confirm("حذف الكود؟")&&remove(ref(db,"accessCodes/"+code));$("codeList").appendChild(el)});if(!$("codeList").children.length)$("codeList").innerHTML='<div class="code-row">لا توجد أكواد دلفري بعد.</div>'}
function renderHistory(){const start=new Date();start.setHours(0,0,0,0);const today=history.filter(([,h])=>(h?.deliveredAt||0)>=start.getTime());$("todayDeliveredCount").textContent=today.length;const ordered=[...history].sort((a,b)=>(a[1]?.deliveredAt||0)-(b[1]?.deliveredAt||0));const seq={};const seqMap=new Map();ordered.forEach(([key,h])=>{const driverKey=h.code||h.id||h.name||"driver",day=new Date(h.deliveredAt||0).toDateString(),k=driverKey+"_"+day;seq[k]=(seq[k]||0)+1;seqMap.set(key,seq[k])});$("historyList").innerHTML="";[...history].sort((a,b)=>(b[1]?.deliveredAt||0)-(a[1]?.deliveredAt||0)).slice(0,50).forEach(([key,h])=>{const el=document.createElement("div");el.className="history-row";const deliveryDuration=h.durationMs!==null&&h.durationMs!==undefined?minutes(h.durationMs):"—",returnDuration=h.returnDurationMs!==null&&h.returnDurationMs!==undefined?minutes(h.returnDurationMs):null,sequence=seqMap.get(key)||1;el.innerHTML=`<div class="history-title"><strong>${esc(h.name||"دلفري")} — الطلب ${sequence}</strong><span class="badge">#${esc(h.orderId||"—")}</span></div><div class="muted small" style="margin-top:5px">📍 ${esc(h.orderLocation||"—")}</div><div class="time-line time-good">⏱️ مدة توصيل الطلب: <b>${deliveryDuration}</b></div><div class="muted small">وقت التسليم: ${h.deliveredAt?new Date(h.deliveredAt).toLocaleString("ar-IQ"):"—"}</div>${returnDuration?`<div class="time-line time-return">↩️ مدة العودة للمطعم بعد آخر طلب: <b>${returnDuration}</b></div><div class="muted small">وقت الوصول للمطعم: ${h.returnedAt?new Date(h.returnedAt).toLocaleString("ar-IQ"):"—"}</div>`:''}`;$("historyList").appendChild(el)});if(!$("historyList").children.length)$("historyList").innerHTML='<div class="history-row">لا توجد طلبات مكتملة حتى الآن.</div>'}
$("addDriverCodeBtn").onclick=async()=>{const name=$("newDriverName").value.trim(),phone=$("newDriverPhone").value.trim(),code=$("newDriverCode").value.trim();if(!name||!code)return alert("اكتب اسم الدلفري وكود الدخول");if(code.length<4||/[.#$\[\]\/]/.test(code))return alert("الكود غير صالح");const exists=await get(ref(db,"accessCodes/"+code));if(exists.exists())return alert("هذا الكود مستخدم مسبقاً");await set(ref(db,"accessCodes/"+code),{role:"driver",name,phone,enabled:true,licenseId:adminLicenseId,createdAt:Date.now()});$("newDriverName").value="";$("newDriverPhone").value="";$("newDriverCode").value=""};
function flattenTenantHistory(raw){const out=[];Object.entries(raw||{}).forEach(([uidKey,items])=>{if(items&&typeof items==="object")Object.entries(items).forEach(([historyKey,item])=>{if(item&&typeof item==="object")out.push([uidKey+"_"+historyKey,item])})});return out}
function listen(){if(initialized)return;initialized=true;onValue(ref(db,"restaurants/"+adminLicenseId+"/drivers"),s=>{drivers=Object.entries(s.val()||{});renderDrivers()});onValue(ref(db,"restaurants/"+adminLicenseId+"/deliveryHistory"),s=>{history=flattenTenantHistory(s.val()||{});renderHistory();renderDrivers()});onValue(ref(db,"accessCodes"),s=>{codes=Object.entries(s.val()||{});renderCodes()});setInterval(()=>{renderDrivers();renderHistory()},15000)}
$("searchDriver").oninput=renderDrivers;$("fitAllBtn").onclick=()=>points.length&&map.fitBounds(points,{padding:[50,50],maxZoom:16});$("logoutBtn").onclick=async()=>{try{await remove(ref(db,"sessions/"+uid))}catch(e){}await signOut(auth);location.replace("./")};
onAuthStateChanged(auth,async user=>{if(!user){try{await signInAnonymously(auth)}catch(e){location.replace("./")}return}uid=user.uid;try{if(!(await verifyAdmin())){location.replace("./");return}$("adminLoading").hidden=true;$("adminApp").hidden=false;setTimeout(()=>map.invalidateSize(),100);listen()}catch(e){console.error(e);location.replace("./")}});
</script>
</body>
</html>
