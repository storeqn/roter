<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="إدارة الدلفري">
<link rel="manifest" href="admin-manifest.webmanifest?v=21">
<link rel="apple-touch-icon" href="admin-icon-180.png?v=21">
<link rel="stylesheet" href="style.css?v=12">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>لوحة المطعم</title>
<style>
#map{height:360px}.admin-grid{display:grid;gap:12px}.code-form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}.driver-row,.code-row,.history-row{padding:12px;border:1px solid rgba(148,163,184,.2);border-radius:14px;margin:8px 0}.driver-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status-on{color:#86efac}.status-off{color:#94a3b8}@media(max-width:700px){.code-form{grid-template-columns:1fr}.summary-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="container" id="adminApp" hidden>
<header class="dashboard-head"><div><h1>لوحة المطعم 🛵</h1><div class="muted">بيانات هذا المطعم فقط</div></div><button id="logoutBtn" class="btn btn-dark">تسجيل الخروج</button></header>
<div class="summary-grid"><div class="summary-card"><span>👤 الإجمالي</span><strong id="totalCount">0</strong></div><div class="summary-card"><span>🟢 في الدوام</span><strong id="onlineCount">0</strong></div><div class="summary-card"><span>🛵 قيد التوصيل</span><strong id="activeDeliveryCount">0</strong></div><div class="summary-card"><span>✅ تم اليوم</span><strong id="todayDeliveredCount">0</strong></div></div>
<section class="map-card"><div id="map"></div></section>
<section class="drivers-panel"><div class="toolbar"><input id="searchDriver" placeholder="بحث عن دلفري أو طلب..."><button id="fitAllBtn" class="btn btn-primary">🗺️ عرض الجميع</button></div><h2>الدلفريات</h2><div id="driverList"></div></section>
<section class="drivers-panel"><h2>إدارة الدلفريين والأكواد</h2><div class="code-form"><input id="newDriverName" placeholder="اسم الدلفري"><input id="newDriverPhone" inputmode="tel" placeholder="رقم الهاتف"><input id="newDriverCode" placeholder="كود الدخول"><button id="addDriverCodeBtn" class="btn btn-primary">+ إضافة دلفري</button></div><div id="codeList"></div></section>
<section class="drivers-panel"><h2>سجل الطلبات المكتملة</h2><div id="historyList"></div></section>
</main>
<div id="adminLoading" class="login-shell"><section class="login-card"><div class="login-icon">🔐</div><h2>جاري التحقق من صلاحية الإدارة...</h2></section></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getDatabase, ref, onValue, get, set, update, remove } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import { firebaseConfig } from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let uid=null,adminLicenseId=null,drivers=[],history=[],tenantHistory=[],legacyHistory=[],codes=[],initialized=false,points=[];const markers={};
const map=L.map("map").setView([30.50,47.78],12);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
function active(d){return !!(d.online&&d.shift&&Date.now()-(d.updatedAt||0)<90000&&typeof d.lat==="number"&&typeof d.lng==="number")}
function orders(d){const a=d?.activeOrders;if(Array.isArray(a))return a.filter(Boolean);if(a&&typeof a==="object")return Object.values(a).filter(Boolean);return d?.orderId?[{orderId:d.orderId,status:d.orderStatus,orderLocation:d.orderLocation}]:[]}
function flattenHistory(raw){const out=[];Object.entries(raw||{}).forEach(([k,v])=>{if(v&&typeof v==="object"&&!("deliveredAt" in v))Object.entries(v).forEach(([sub,item])=>out.push([k+"_"+sub,item]));else out.push([k,v])});return out}
function rebuildHistory(){const all=[...tenantHistory,...legacyHistory.filter(([,h])=>h&&h.licenseId===adminLicenseId)],seen=new Set();history=[];all.forEach(([id,h])=>{if(!h)return;const key=String(h.key||"")+"|"+String(h.deliveredAt||"")+"|"+String(h.orderId||"")+"|"+String(h.code||"");if(seen.has(key))return;seen.add(key);history.push([id,h])});renderHistory()}
async function verifyAdmin(){const s=await get(ref(db,"sessions/"+uid));if(!s.exists())return false;const session=s.val()||{},code=session.code,c=await get(ref(db,"accessCodes/"+code)),v=c.val();if(!(v&&v.role==="admin"&&v.enabled===true&&typeof v.licenseId==="string"&&v.licenseId))return false;adminLicenseId=v.licenseId;return session.licenseId===adminLicenseId}
function renderDrivers(){const q=$("searchDriver").value.trim().toLowerCase();$("driverList").innerHTML="";points=[];let on=0,route=0;drivers.forEach(([id,d])=>{const isOn=active(d),os=orders(d);if(isOn)on++;route+=os.filter(o=>o.status==="on_route").length;if(typeof d.lat==="number"&&typeof d.lng==="number"){if(!markers[id])markers[id]=L.marker([d.lat,d.lng]).addTo(map);else markers[id].setLatLng([d.lat,d.lng]);markers[id].bindPopup(`<div dir="rtl"><b>${esc(d.name||"دلفري")}</b><br>📞 ${esc(d.phone||"—")}</div>`);if(isOn)points.push([d.lat,d.lng])}if(q&&!String(d.name||"").toLowerCase().includes(q)&&!String(d.phone||"").includes(q)&&!os.some(o=>String(o.orderId||"").toLowerCase().includes(q)))return;const el=document.createElement("div");el.className="driver-row";el.innerHTML=`<strong>${esc(d.name||"دلفري")}</strong><div class="${isOn?'status-on':'status-off'}">${isOn?'● متصل الآن':'● خارج الدوام'}</div><div class="muted small">📞 ${esc(d.phone||"—")} · 📦 ${os.length} طلب</div><div class="driver-actions"><button class="btn btn-primary focus" ${typeof d.lat==="number"?'':'disabled'}>عرض الموقع</button>${d.phone?`<a class="btn btn-dark" href="tel:${esc(d.phone)}">📞 اتصال</a>`:''}<button class="btn btn-danger delete">حذف</button></div>`;el.querySelector(".focus").onclick=()=>{if(markers[id]){map.setView(markers[id].getLatLng(),17);markers[id].openPopup()}};el.querySelector(".delete").onclick=()=>deleteDriver(id,d);$("driverList").appendChild(el)});$("totalCount").textContent=drivers.length;$("onlineCount").textContent=on;$("activeDeliveryCount").textContent=route;if(!$("driverList").children.length)$("driverList").innerHTML='<div class="driver-row">لا توجد نتائج.</div>'}
async function deleteDriver(id,d){if(!confirm("حذف هذا الدلفري؟"))return;const code=String(d.code||"").trim();await Promise.all([remove(ref(db,"restaurants/"+adminLicenseId+"/drivers/"+id)),remove(ref(db,"drivers/"+id)),remove(ref(db,"sessions/"+id)),code?remove(ref(db,"accessCodes/"+code)):Promise.resolve()])}
function renderCodes(){$("codeList").innerHTML="";codes.filter(([,v])=>v&&v.role==="driver"&&v.licenseId===adminLicenseId).forEach(([code,v])=>{const el=document.createElement("div");el.className="code-row";el.innerHTML=`<strong>${esc(v.name||"دلفري")}</strong><div class="muted small">📞 ${esc(v.phone||"—")} · الكود: ${esc(code)} · ${v.enabled?'فعال':'متوقف'}</div><div class="driver-actions"><button class="btn btn-dark toggle">${v.enabled?'إيقاف':'تفعيل'}</button><button class="btn btn-danger del">حذف</button></div>`;el.querySelector(".toggle").onclick=()=>update(ref(db,"accessCodes/"+code),{enabled:!v.enabled});el.querySelector(".del").onclick=()=>confirm("حذف الكود؟")&&remove(ref(db,"accessCodes/"+code));$("codeList").appendChild(el)});if(!$("codeList").children.length)$("codeList").innerHTML='<div class="code-row">لا توجد أكواد دلفري بعد.</div>'}
function renderHistory(){const start=new Date();start.setHours(0,0,0,0);$("todayDeliveredCount").textContent=history.filter(([,h])=>(h?.deliveredAt||0)>=start.getTime()).length;$("historyList").innerHTML="";[...history].sort((a,b)=>(b[1]?.deliveredAt||0)-(a[1]?.deliveredAt||0)).slice(0,30).forEach(([,h])=>{const el=document.createElement("div");el.className="history-row";el.innerHTML=`<strong>${esc(h.name||"دلفري")}</strong><div class="muted small">طلب #${esc(h.orderId||"—")} · ${esc(h.orderLocation||"—")}</div><div class="muted small">${h.deliveredAt?new Date(h.deliveredAt).toLocaleString("ar-IQ"):"—"}</div>`;$("historyList").appendChild(el)});if(!$("historyList").children.length)$("historyList").innerHTML='<div class="history-row">لا توجد طلبات مكتملة حتى الآن.</div>'}
$("addDriverCodeBtn").onclick=async()=>{const name=$("newDriverName").value.trim(),phone=$("newDriverPhone").value.trim(),code=$("newDriverCode").value.trim();if(!name||!code)return alert("اكتب اسم الدلفري وكود الدخول");if(code.length<4||/[.#$\[\]\/]/.test(code))return alert("الكود غير صالح");const exists=await get(ref(db,"accessCodes/"+code));if(exists.exists())return alert("هذا الكود مستخدم مسبقاً");await set(ref(db,"accessCodes/"+code),{role:"driver",name,phone,enabled:true,licenseId:adminLicenseId,createdAt:Date.now()});$("newDriverName").value="";$("newDriverPhone").value="";$("newDriverCode").value=""};
function listen(){if(initialized)return;initialized=true;onValue(ref(db,"restaurants/"+adminLicenseId+"/drivers"),s=>{drivers=Object.entries(s.val()||{});renderDrivers()});onValue(ref(db,"restaurants/"+adminLicenseId+"/deliveryHistory"),s=>{tenantHistory=flattenHistory(s.val()||{});rebuildHistory()});onValue(ref(db,"deliveryHistory"),s=>{legacyHistory=flattenHistory(s.val()||{});rebuildHistory()});onValue(ref(db,"accessCodes"),s=>{codes=Object.entries(s.val()||{});renderCodes()});setInterval(renderDrivers,15000)}
$("searchDriver").oninput=renderDrivers;$("fitAllBtn").onclick=()=>points.length&&map.fitBounds(points,{padding:[50,50],maxZoom:16});$("logoutBtn").onclick=async()=>{try{await remove(ref(db,"sessions/"+uid))}catch(e){}await signOut(auth);location.replace("./")};
onAuthStateChanged(auth,async user=>{if(!user){try{await signInAnonymously(auth)}catch(e){location.replace("./")}return}uid=user.uid;try{if(!(await verifyAdmin())){location.replace("./");return}$("adminLoading").hidden=true;$("adminApp").hidden=false;setTimeout(()=>map.invalidateSize(),100);listen()}catch(e){console.error(e);location.replace("./")}});
</script>
</body>
</html>
