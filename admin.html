<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <title>لوحة متابعة الدلفري</title>
</head>
<body>
<main class="container">
  <div class="topbar">
    <div>
      <div class="badge">لوحة الإدارة</div>
      <h1>متابعة الدلفري 📍</h1>
      <div class="muted">مواقع السائقين مباشرة في مكان واحد</div>
    </div>
    <a href="driver.html" class="btn btn-dark">فتح صفحة الدلفري</a>
  </div>

  <div class="summary-grid">
    <div class="summary-card"><span>🟢 في الدوام</span><strong id="onlineCount">0</strong></div>
    <div class="summary-card"><span>⚪ خارج الدوام</span><strong id="offlineCount">0</strong></div>
    <div class="summary-card"><span>🛵 إجمالي الدلفري</span><strong id="totalCount">0</strong></div>
  </div>

  <section class="card">
    <div id="setupWarning" class="warning" hidden>لم يتم ربط Firebase بعد.</div>
    <div id="map"></div>

    <div class="section-title">
      <h2>الدلفريات</h2>
      <button id="fitAllBtn" class="btn btn-dark btn-small">عرض الجميع على الخريطة</button>
    </div>

    <div id="driverList" class="driver-list"></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import { firebaseConfig, firebaseReady } from "./firebase-config.js";

const map = L.map("map").setView([30.50, 47.78], 10);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

const list = document.getElementById("driverList");
const onlineCount = document.getElementById("onlineCount");
const offlineCount = document.getElementById("offlineCount");
const totalCount = document.getElementById("totalCount");
const fitAllBtn = document.getElementById("fitAllBtn");
const markers = {};
let currentActivePoints = [];
let firstFit = true;

function markerIcon(name, active) {
  return L.divIcon({
    className: "driver-marker-wrap",
    html: `<div class="driver-marker ${active ? "active" : "inactive"}"><span>🛵</span><b>${name || "دلفري"}</b></div>`,
    iconSize: [110,44],
    iconAnchor: [55,38]
  });
}

function focusDriver(id) {
  const marker = markers[id];
  if (!marker) return;
  map.setView(marker.getLatLng(), 17, {animate:true});
  marker.openPopup();
}

fitAllBtn.addEventListener("click", () => {
  if (currentActivePoints.length) {
    map.fitBounds(currentActivePoints, {padding:[45,45], maxZoom:16});
  }
});

if (!firebaseReady) {
  document.getElementById("setupWarning").hidden = false;
  list.innerHTML = '<div class="driver-item">أكمل ربط Firebase أولاً حتى تظهر المواقع المباشرة.</div>';
} else {
  const db = getDatabase(initializeApp(firebaseConfig));

  onValue(ref(db, "drivers"), snap => {
    const drivers = snap.val() || {};
    const entries = Object.entries(drivers);
    list.innerHTML = "";
    currentActivePoints = [];

    let online = 0;

    entries.sort((a,b) => {
      const A = a[1], B = b[1];
      const aActive = !!(A.online && A.shift && Date.now()-(A.updatedAt||0)<90000);
      const bActive = !!(B.online && B.shift && Date.now()-(B.updatedAt||0)<90000);
      if (aActive !== bActive) return aActive ? -1 : 1;
      return (B.updatedAt||0) - (A.updatedAt||0);
    });

    entries.forEach(([id,d]) => {
      const age = Date.now() - (d.updatedAt || 0);
      const hasLocation = typeof d.lat==="number" && typeof d.lng==="number";
      const active = !!(d.online && d.shift && age < 90000 && hasLocation);
      if (active) online++;

      const item = document.createElement("div");
      item.className = "driver-item driver-row";
      item.innerHTML = `
        <div class="driver-main">
          <div class="driver-title">
            <span class="presence ${active ? "online" : "offline"}"></span>
            <strong>${d.name || "دلفري"}</strong>
          </div>
          <div class="driver-meta">
            <span>الطلب: <b>${d.orderId || "لا يوجد"}</b></span>
            <span>${active ? "متصل الآن" : "خارج الدوام"}</span>
          </div>
          <div class="small muted">آخر تحديث: ${d.updatedAt ? new Date(d.updatedAt).toLocaleString("ar-IQ") : "—"}</div>
        </div>
        <button class="btn btn-dark btn-small focus-btn" ${hasLocation ? "" : "disabled"}>عرض الموقع</button>
      `;

      item.querySelector(".focus-btn").addEventListener("click", () => focusDriver(id));
      list.appendChild(item);

      if (hasLocation) {
        if (!markers[id]) {
          markers[id] = L.marker([d.lat,d.lng], {icon:markerIcon(d.name, active)}).addTo(map);
        } else {
          markers[id].setLatLng([d.lat,d.lng]);
          markers[id].setIcon(markerIcon(d.name, active));
        }

        markers[id].bindPopup(`
          <div dir="rtl" style="min-width:150px">
            <b>${d.name || "دلفري"}</b><br>
            الحالة: ${active ? "في الدوام" : "خارج الدوام"}<br>
            الطلب: ${d.orderId || "لا يوجد"}<br>
            آخر تحديث: ${d.updatedAt ? new Date(d.updatedAt).toLocaleTimeString("ar-IQ") : "—"}
          </div>
        `);

        if (active) currentActivePoints.push([d.lat,d.lng]);
      }
    });

    onlineCount.textContent = online;
    offlineCount.textContent = Math.max(entries.length - online, 0);
    totalCount.textContent = entries.length;

    if (!entries.length) {
      list.innerHTML = '<div class="driver-item">لا يوجد دلفري مسجل حتى الآن.</div>';
    }

    if (firstFit && currentActivePoints.length) {
      map.fitBounds(currentActivePoints, {padding:[45,45], maxZoom:16});
      firstFit = false;
    }
  });
}
</script>
</body>
</html>
